<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Social Ticker</title>
  <style>
    @font-face {
      font-family: 'ApexFont';
      src: local('Segoe UI'), local('Arial');
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      width: 360px;
      height: 38px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ticker-card {
      width: 100%;
      height: 36px;
      background: linear-gradient(135deg, rgba(14, 18, 24, 0.92) 0%, rgba(20, 26, 36, 0.95) 100%);
      border: 1px solid rgba(0, 255, 102, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 255, 102, 0.08);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      position: relative;
      overflow: hidden;
    }
    .ticker-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #00FF66;
      box-shadow: 0 0 8px #00FF66;
    }
    .slide {
      display: none;
      align-items: center;
      width: 100%;
      gap: 10px;
      opacity: 0;
      transform: translateX(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .slide.active {
      display: flex;
      opacity: 1;
      transform: translateX(0);
    }
    .icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .icon svg {
      width: 16px;
      height: 16px;
      fill: #FFFFFF;
    }
    .platform-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
      color: #FFFFFF;
    }
    .handle {
      font-size: 13px;
      font-weight: 700;
      color: #E6EAF0;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tag {
      margin-left: auto;
      font-size: 10px;
      font-weight: 800;
      color: #00FF66;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 255, 102, 0.12);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(0, 255, 102, 0.3);
    }
  </style>
</head>
<body>
  <div class="ticker-card">
    <!-- Slide 1: Twitch -->
    <div class="slide active" id="slide-0">
      <div class="icon" style="background: #9146FF;">
        <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
      </div>
      <span class="platform-badge" style="background: rgba(145, 70, 255, 0.3);">Twitch</span>
      <span class="handle">caaptainsolo</span>
      <span class="tag">LIVE</span>
    </div>

    <!-- Slide 2: Octane Speed Demon -->
    <div class="slide" id="slide-1">
      <div class="icon" style="background: #00FF66;">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#0A0E14"/></svg>
      </div>
      <span class="platform-badge" style="background: rgba(0, 255, 102, 0.25); color: #00FF66;">Apex</span>
      <span class="handle">Octane Speed Demon</span>
      <span class="tag">10K+ RP</span>
    </div>

    <!-- Slide 3: YouTube -->
    <div class="slide" id="slide-2">
      <div class="icon" style="background: #FF0000;">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </div>
      <span class="platform-badge" style="background: rgba(255, 0, 0, 0.25);">YouTube</span>
      <span class="handle">@caaptainsolo</span>
      <span class="tag">Clips</span>
    </div>

    <!-- Slide 4: TikTok -->
    <div class="slide" id="slide-3">
      <div class="icon" style="background: #00F2FE;">
        <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-1.01-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.24 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
      </div>
      <span class="platform-badge" style="background: rgba(0, 242, 254, 0.25); color: #00F2FE;">TikTok</span>
      <span class="handle">@caaptainsolo</span>
      <span class="tag">Montages</span>
    </div>

    <!-- Slide 5: Discord -->
    <div class="slide" id="slide-4">
      <div class="icon" style="background: #5865F2;">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      </div>
      <span class="platform-badge" style="background: rgba(88, 101, 242, 0.25);">Discord</span>
      <span class="handle">Solo Squad</span>
      <span class="tag">Join</span>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;

    setInterval(() => {
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
    }, 5000);
  </script>
</body>
</html>

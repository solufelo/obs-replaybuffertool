<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Solo Social Ticker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      width: 360px;
      height: 38px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Luxury Smoked Glass Bar */
    .ticker-bar {
      width: 356px;
      height: 34px;
      background: rgba(9, 11, 15, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      padding: 0 10px;
      position: relative;
    }

    /* Monogram Brand Mark */
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 9px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.45);
    }

    /* Marquee Stage */
    .stage {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      margin-left: 9px;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .platform-icon {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.85);
      flex-shrink: 0;
    }

    .platform-name {
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .separator {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.25);
    }

    .handle-name {
      font-size: 11px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Micro Right Tag */
    .tag-right {
      margin-left: auto;
      font-size: 8px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.32);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding-left: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ticker-bar">
    <div class="brand-mark">
      <img src="assets/captain_solo_logo.png" class="brand-logo-img" alt="Captain Solo">
    </div>

    <div class="stage">
      <!-- Twitch -->
      <div class="slide active">
        <svg class="platform-icon" viewBox="0 0 24 24">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
        </svg>
        <span class="platform-name">TWITCH</span>
        <span class="separator">//</span>
        <span class="handle-name">caaptainsolo</span>
      </div>

      <!-- YouTube -->
      <div class="slide">
        <svg class="platform-icon" viewBox="0 0 24 24">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span class="platform-name">YOUTUBE</span>
        <span class="separator">//</span>
        <span class="handle-name">CaptainSolo</span>
      </div>

      <!-- Discord -->
      <div class="slide">
        <svg class="platform-icon" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span class="platform-name">DISCORD</span>
        <span class="separator">//</span>
        <span class="handle-name">discord.gg/cptoslo</span>
      </div>

      <!-- X / Twitter -->
      <div class="slide">
        <svg class="platform-icon" viewBox="0 0 24 24">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <span class="platform-name">X</span>
        <span class="separator">//</span>
        <span class="handle-name">@caaptainsolo</span>
      </div>
    </div>

    <div class="tag-right">OFFICIAL</div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;

    function nextSlide() {
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
    }

    setInterval(nextSlide, 5500);
  </script>
</body>
</html>

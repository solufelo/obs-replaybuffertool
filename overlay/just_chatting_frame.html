<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Solo Just Chatting Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Left Camera Bezel (1140x760 at 60,80) */
    .cam-frame {
      position: absolute;
      left: 60px;
      top: 80px;
      width: 1140px;
      height: 760px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    /* Docked Studio Badge */
    .cam-header {
      position: absolute;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(9, 11, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 7px 16px;
      border-top-right-radius: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #FF3B30;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .cam-title {
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .cam-subtitle {
      font-size: 9.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding-left: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Right Column - Top Ranked Slot */
    .ranked-frame {
      position: absolute;
      left: 1230px;
      top: 80px;
      width: 630px;
      height: 155px;
      background: rgba(9, 11, 15, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ranked-header {
      height: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .ranked-label {
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .ranked-meta {
      font-size: 8.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.12em;
    }

    /* Right Column - Bottom Stream Chat Dock */
    .chat-dock {
      position: absolute;
      left: 1230px;
      top: 247px;
      width: 630px;
      height: 593px;
      background: rgba(9, 11, 15, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-dock-header {
      height: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .chat-label {
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .chat-status-pip {
      width: 6px;
      height: 6px;
      background: #FFFFFF;
      border-radius: 50%;
      opacity: 0.7;
    }

    .chat-meta {
      font-size: 9.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.12em;
    }

    .chat-body-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Bottom Studio Banner */
    .studio-footer {
      position: absolute;
      left: 60px;
      top: 870px;
      width: 1800px;
      height: 74px;
      background: rgba(9, 11, 15, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-brand {
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .footer-desc {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    .footer-socials {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 5px;
    }

    .social-icon {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.8);
    }

    .social-title {
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .social-handle {
      font-size: 11px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <!-- Camera Frame -->
  <div class="cam-frame">
    <div class="cam-header">
      <img src="assets/captain_solo_logo.png" style="width: 14px; height: 14px; border-radius: 50%; object-fit: cover;" alt="Logo">
      <div class="live-dot"></div>
      <span class="cam-title">CAPTAIN SOLO</span>
      <span class="cam-subtitle">MAIN BROADCAST</span>
    </div>
  </div>

  <!-- Right Column Top: Dedicated Activity Slot -->
  <div class="ranked-frame">
    <div class="ranked-header">
      <span class="ranked-label">NOW STREAMING // ACTIVE SESSION</span>
      <span class="ranked-meta">LIVE BROADCAST</span>
    </div>
  </div>

  <!-- Right Column Bottom: Chat Dock Frame -->
  <div class="chat-dock">
    <div class="chat-dock-header">
      <div class="chat-label">
        <div class="chat-status-pip"></div>
        <span>LIVE CHAT DOCK</span>
      </div>
      <div class="chat-meta">TWITCH & YOUTUBE STREAM</div>
    </div>
    <div class="chat-body-placeholder">
      <!-- Live chat dock renders here in OBS -->
    </div>
  </div>

  <!-- Studio Footer Banner -->
  <div class="studio-footer">
    <div class="footer-left">
      <span class="footer-brand">CAPTAIN SOLO</span>
      <span class="footer-desc">OFFICIAL BROADCAST // ENTERTAINMENT, VARIETY & ESPORTS</span>
    </div>

    <div class="footer-socials">
      <div class="social-pill">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
        </svg>
        <span class="social-title">TWITCH</span>
        <span class="social-handle">caaptainsolo</span>
      </div>

      <div class="social-pill">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span class="social-title">YOUTUBE</span>
        <span class="social-handle">CaptainSolo</span>
      </div>

      <div class="social-pill">
        <svg class="social-icon" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span class="social-title">DISCORD</span>
        <span class="social-handle">.gg/cptoslo</span>
      </div>
    </div>
  </div>
</body>
</html>

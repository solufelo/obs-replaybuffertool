<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Solo Live Music & Spotify HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      width: 360px;
      height: 48px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Luxury Smoked Glass Bar */
    .player-card {
      width: 356px;
      height: 42px;
      background: rgba(9, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 9px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle Animated Ambient Glow */
    .ambient-glow {
      position: absolute;
      left: -20px;
      top: -10px;
      width: 80px;
      height: 60px;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.25) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(12px);
      transition: opacity 0.5s ease;
    }

    /* Album Art / Vinyl Container */
    .art-container {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      background: #0D1117;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .art-placeholder {
      width: 16px;
      height: 16px;
      fill: #1DB954;
      filter: drop-shadow(0 0 4px rgba(29, 185, 84, 0.8));
    }

    /* Track Meta Stage */
    .track-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5px;
    }

    .track-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .track-artist {
      font-size: 8.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .artist-badge {
      font-size: 7px;
      color: #1DB954;
      font-weight: 800;
    }

    /* Live Equalizer Visualizer Bars */
    .eq-cluster {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 2px;
      height: 3px;
      background: #1DB954;
      border-radius: 1px;
      transition: height 0.15s ease;
      box-shadow: 0 0 6px rgba(29, 185, 84, 0.6);
    }

    .playing .eq-bar:nth-child(1) { animation: eqBounce 0.9s infinite ease-in-out; }
    .playing .eq-bar:nth-child(2) { animation: eqBounce 1.2s infinite ease-in-out 0.2s; }
    .playing .eq-bar:nth-child(3) { animation: eqBounce 0.7s infinite ease-in-out 0.4s; }
    .playing .eq-bar:nth-child(4) { animation: eqBounce 1.1s infinite ease-in-out 0.1s; }

    @keyframes eqBounce {
      0%, 100% { height: 3px; }
      50% { height: 13px; }
    }

    /* Right Tag: Status Pill */
    .tag-status {
      font-size: 7.5px;
      font-weight: 800;
      color: #1DB954;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 6px;
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid rgba(29, 185, 84, 0.35);
      border-radius: 3px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pulse-dot {
      width: 4px;
      height: 4px;
      background: #1DB954;
      border-radius: 50%;
      box-shadow: 0 0 6px #1DB954;
      animation: dotPulse 1.8s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .paused .pulse-dot {
      background: rgba(255, 255, 255, 0.4);
      box-shadow: none;
      animation: none;
    }
    .paused .tag-status {
      color: rgba(255, 255, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div class="player-card" id="playerCard">
    <div class="ambient-glow"></div>

    <!-- Art Box -->
    <div class="art-container">
      <img id="artImg" class="art-img" src="" alt="Album Art">
      <svg id="artPlaceholder" class="art-placeholder" viewBox="0 0 24 24">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
    </div>

    <!-- Track Details -->
    <div class="track-meta">
      <div id="trackTitle" class="track-title">Waiting for Music...</div>
      <div id="trackArtist" class="track-artist">
        <span class="artist-badge">♫</span>
        <span id="artistName">Spotify / System Audio</span>
      </div>
    </div>

    <!-- Live Animated Audio Equalizer -->
    <div id="eqCluster" class="eq-cluster">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>

    <!-- Live Badge -->
    <div id="tagStatus" class="tag-status">
      <div class="pulse-dot"></div>
      <span id="statusTxt">STANDBY</span>
    </div>
  </div>

  <script>
    const trackTitle = document.getElementById('trackTitle');
    const artistName = document.getElementById('artistName');
    const artImg = document.getElementById('artImg');
    const artPlaceholder = document.getElementById('artPlaceholder');
    const eqCluster = document.getElementById('eqCluster');
    const tagStatus = document.getElementById('tagStatus');
    const statusTxt = document.getElementById('statusTxt');

    let lastTitle = '';

    async function pollNowPlaying() {
      try {
        const res = await fetch('/api/now-playing');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();

        if (data.Active && data.Title) {
          if (data.Title !== lastTitle) {
            trackTitle.textContent = data.Title;
            artistName.textContent = data.Artist || (data.App ? data.App.split('.')[0] : 'Now Playing');
            lastTitle = data.Title;

            // Load album art if available
            if (data.HasThumb) {
              artImg.src = '/assets/now_playing_art.png?t=' + Date.now();
              artImg.style.display = 'block';
              artPlaceholder.style.display = 'none';
            } else {
              artImg.style.display = 'none';
              artPlaceholder.style.display = 'block';
            }
          }

          if (data.Status === 'Playing') {
            eqCluster.className = 'eq-cluster playing';
            tagStatus.className = 'tag-status';
            statusTxt.textContent = 'LIVE';
          } else {
            eqCluster.className = 'eq-cluster paused';
            tagStatus.className = 'tag-status paused';
            statusTxt.textContent = 'PAUSED';
          }
        } else {
          trackTitle.textContent = 'Spotify / Live Audio';
          artistName.textContent = 'Waiting for track playback';
          eqCluster.className = 'eq-cluster paused';
          tagStatus.className = 'tag-status paused';
          statusTxt.textContent = 'STANDBY';
          artImg.style.display = 'none';
          artPlaceholder.style.display = 'block';
        }
      } catch (err) {
        // Fallback demo state if daemon is restarting
      }
    }

    pollNowPlaying();
    setInterval(pollNowPlaying, 1800);
  </script>
</body>
</html>

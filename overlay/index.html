<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captain Solo Precision Telemetry</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      width: 360px;
      height: 130px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Precision Smoked Glass Console */
    .telemetry-card {
      width: 356px;
      height: 126px;
      background: rgba(9, 11, 15, 0.85);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      box-shadow: 
        0 14px 36px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: 
        border-color 0.28s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.32s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.3s ease;
    }

    /* Ambient Kinetic Aura during High-APM Movement (Neo-Strafes / Ras-Strafes) */
    .telemetry-card.velocity-boost {
      border-color: rgba(255, 255, 255, 0.34);
      box-shadow: 
        0 16px 44px rgba(0, 0, 0, 0.85),
        0 0 28px rgba(255, 255, 255, 0.22),
        inset 0 0 18px rgba(255, 255, 255, 0.07);
    }

    .telemetry-card.velocity-max {
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 
        0 18px 48px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(255, 255, 255, 0.4),
        inset 0 0 24px rgba(255, 255, 255, 0.12);
    }

    /* Micro Header Bar */
    .telemetry-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 13px;
      padding: 0 2px;
      margin-bottom: 2px;
    }

    .telemetry-title {
      font-size: 8.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 4px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 50%;
      opacity: 0.8;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .telemetry-card.velocity-boost .status-dot {
      box-shadow: 0 0 8px #FFFFFF;
      transform: scale(1.2);
      opacity: 1;
    }

    /* Movement Combo Badge (Superglide, Tap-Strafe Streak) */
    .combo-badge {
      display: none;
      font-size: 7.5px;
      font-weight: 800;
      color: #0A0C10;
      background: #FFFFFF;
      padding: 1px 5px;
      border-radius: 2px;
      letter-spacing: 0.12em;
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .combo-badge.active {
      display: inline-block;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .metrics-cluster {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .apm-gauge {
      font-size: 8px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .telemetry-card.velocity-boost .apm-gauge {
      color: #FFFFFF;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }

    .rate-badge {
      font-size: 8px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 0.1em;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 6px;
    }

    /* Key Rows */
    .row {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 29px;
    }

    /* Base Keycap Styling with Kinetic Phosphor Decay */
    .key {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      transform: scale(1);
      /* Kinetic Phosphor Trail Decay on Release */
      transition: 
        background 0.24s cubic-bezier(0.12, 0.9, 0.2, 1),
        border-color 0.24s cubic-bezier(0.12, 0.9, 0.2, 1),
        box-shadow 0.26s cubic-bezier(0.12, 0.9, 0.2, 1),
        color 0.14s ease,
        transform 0.16s cubic-bezier(0.12, 0.9, 0.2, 1);
      cursor: default;
      overflow: hidden;
    }

    /* 0ms Instantaneous Peak Strike */
    .key.active {
      background: #FFFFFF !important;
      color: #0A0C10 !important;
      border-color: #FFFFFF !important;
      font-weight: 800 !important;
      transform: scale(1.05);
      box-shadow: 
        0 0 18px rgba(255, 255, 255, 1),
        0 0 34px rgba(255, 255, 255, 0.45),
        inset 0 0 6px rgba(255, 255, 255, 0.9) !important;
      transition: none !important; /* Zero lag on press */
      z-index: 2;
    }

    /* Luminescent Phosphor Trail (Traces neo-strafe circles A -> S -> D -> W) */
    .key.trail {
      background: rgba(255, 255, 255, 0.32);
      border-color: rgba(255, 255, 255, 0.55);
      color: #FFFFFF;
      box-shadow: 
        0 0 14px rgba(255, 255, 255, 0.45),
        inset 0 0 6px rgba(255, 255, 255, 0.2);
    }

    /* Superglide Synchronized Kinetic Surge */
    .key.superglide {
      background: #FFFFFF !important;
      color: #0A0C10 !important;
      border-color: #FFFFFF !important;
      transform: scale(1.08) !important;
      box-shadow: 
        0 0 26px rgba(255, 255, 255, 1),
        0 0 48px rgba(255, 255, 255, 0.75) !important;
      z-index: 3;
    }

    /* Key Proportions */
    .w-key { width: 32px; }
    .wasd { width: 32px; }
    
    .tactical-key {
      width: 58px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tactical-sub {
      font-size: 8px;
      font-weight: 600;
      opacity: 0.6;
      letter-spacing: 0.08em;
    }
    .key.active .tactical-sub {
      opacity: 0.9;
      color: #0A0C10;
    }
    .tactical-key.active {
      transform: scale(1.07);
      box-shadow: 
        0 0 22px rgba(255, 255, 255, 1),
        0 0 40px rgba(255, 255, 255, 0.6) !important;
    }

    .interact-key {
      width: 54px;
      font-size: 11px;
    }

    .sprint-key {
      width: 58px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .crouch-key {
      width: 68px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .holster-key {
      width: 58px;
      font-size: 10.5px;
      letter-spacing: 0.06em;
    }

    .jump-key {
      flex: 1;
      height: 28px;
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    /* Scroll Wheel Indicator with Tap-Strafe Streak Multiplier */
    .wheel-pip {
      width: 22px;
      height: 28px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.03s ease;
      cursor: default;
    }
    .wheel-pip.active {
      background: #FFFFFF !important;
      color: #0A0C10 !important;
      border-color: #FFFFFF !important;
      font-weight: 900 !important;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.8) !important;
    }
    /* Rapid Tap-Strafe Kinetic Surge */
    .wheel-pip.surging {
      background: #FFFFFF !important;
      color: #0A0C10 !important;
      border-color: #FFFFFF !important;
      transform: scale(1.14) !important;
      box-shadow: 
        0 0 24px rgba(255, 255, 255, 1),
        0 0 45px rgba(255, 255, 255, 0.7) !important;
      z-index: 2;
    }

    /* Mouse Visualizer */
    .mouse-cluster {
      display: flex;
      align-items: center;
      margin-left: auto;
      padding-left: 6px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mouse-shell {
      position: relative;
      width: 24px;
      height: 38px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px 12px 8px 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .mouse-shell.firing {
      border-color: #FFFFFF;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .mouse-split {
      display: flex;
      width: 100%;
      height: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    }

    .mouse-btn {
      flex: 1;
      height: 100%;
      transition: background 0.02s ease;
    }
    .mouse-btn.left {
      border-right: 1px solid rgba(255, 255, 255, 0.25);
    }
    .mouse-btn.active {
      background: #FFFFFF !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 1);
    }

    .mouse-wheel-track {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 8px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 1.5px;
      transition: all 0.03s ease;
    }
    .mouse-wheel-track.up {
      background: #FFFFFF !important;
      transform: translateX(-50%) translateY(-2.5px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 1);
    }
    .mouse-wheel-track.down {
      background: #FFFFFF !important;
      transform: translateX(-50%) translateY(2.5px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 1);
    }
  </style>
</head>
<body>
  <div class="telemetry-card" id="telemetryCard">
    <!-- Top Telemetry Micro Header with Dynamic APM & Combo Badge -->
    <div class="telemetry-header">
      <div class="telemetry-title">
        <div class="status-dot"></div>
        <span>TELEMETRY // INPUT</span>
        <span id="comboBadge" class="combo-badge">GLIDE</span>
      </div>
      <div class="metrics-cluster">
        <div class="apm-gauge" id="apmDisplay">0 APM</div>
        <div class="rate-badge">120HZ</div>
      </div>
    </div>

    <!-- Row 1: Tactical [P / Alt], W, Interact [E], Wheel Up, Mouse -->
    <div class="row">
      <div id="key-stim" class="key tactical-key" title="Tactical Ability (P / Left Alt)">
        <span>P</span>
        <span class="tactical-sub">TAC</span>
      </div>
      <div id="key-w" class="key wasd">W</div>
      <div id="key-interact" class="key interact-key">E</div>
      <div id="wheel-up" class="wheel-pip" title="Tap-Strafe (Wheel Up)">▲</div>

      <!-- Mouse Split Telemetry -->
      <div class="mouse-cluster">
        <div class="mouse-shell" id="mouseShell">
          <div class="mouse-split">
            <div id="mouse-lmb" class="mouse-btn left"></div>
            <div id="mouse-rmb" class="mouse-btn right"></div>
          </div>
          <div id="mouse-wheel" class="mouse-wheel-track"></div>
        </div>
      </div>
    </div>

    <!-- Row 2: Sprint [Shift], A, S, D, Crouch [C / Ctrl] -->
    <div class="row">
      <div id="key-sprint" class="key sprint-key">SHIFT</div>
      <div id="key-a" class="key wasd">A</div>
      <div id="key-s" class="key wasd">S</div>
      <div id="key-d" class="key wasd">D</div>
      <div id="key-crouch" class="key crouch-key">CROUCH</div>
    </div>

    <!-- Row 3: Holster [3], Space [Jump], Wheel Down [Bhop] -->
    <div class="row">
      <div id="btn-weapon" class="key holster-key" title="Holster / Cycle (3 / MB4)">HOLSTER</div>
      <div id="key-jump" class="key jump-key">SPACE</div>
      <div id="wheel-down" class="wheel-pip" title="Bhop / Jump (Wheel Down)">▼</div>
    </div>
  </div>

  <script>
    const elements = {
      'W': document.getElementById('key-w'),
      'A': document.getElementById('key-a'),
      'S': document.getElementById('key-s'),
      'D': document.getElementById('key-d'),
      'STIM': document.getElementById('key-stim'),
      'SPRINT': document.getElementById('key-sprint'),
      'INTERACT': document.getElementById('key-interact'),
      'CROUCH': document.getElementById('key-crouch'),
      'JUMP': document.getElementById('key-jump'),
      'WEAPON': document.getElementById('btn-weapon'),
      'LMB': document.getElementById('mouse-lmb'),
      'RMB': document.getElementById('mouse-rmb'),
      'WHEEL_UP': document.getElementById('wheel-up'),
      'WHEEL_DOWN': document.getElementById('wheel-down'),
      'MOUSE_WHEEL': document.getElementById('mouse-wheel')
    };

    const telemetryCard = document.getElementById('telemetryCard');
    const apmDisplay = document.getElementById('apmDisplay');
    const comboBadge = document.getElementById('comboBadge');
    const mouseShell = document.getElementById('mouseShell');

    let wheelUpTimer = null;
    let wheelDownTimer = null;
    let wheelUpTicks = 0;
    let wheelTickResetTimer = null;

    // Movement History & APM Tracking
    const inputHistory = [];
    let lastJumpTime = 0;
    let lastCrouchTime = 0;
    let comboTimer = null;
    const trailTimers = {};

    function recordInputEvent() {
      const now = performance.now();
      inputHistory.push(now);

      // Prune events older than 1.2 seconds
      while (inputHistory.length > 0 && now - inputHistory[0] > 1200) {
        inputHistory.shift();
      }

      // Calculate instantaneous APM: (events / 1.2) * 60
      const currentAPM = Math.min(999, Math.round((inputHistory.length / 1.2) * 60));
      apmDisplay.textContent = `${currentAPM} APM`;

      // Dynamic Ambient Console Aura based on movement intensity
      if (currentAPM >= 220) {
        telemetryCard.classList.add('velocity-max');
        telemetryCard.classList.remove('velocity-boost');
      } else if (currentAPM >= 110) {
        telemetryCard.classList.add('velocity-boost');
        telemetryCard.classList.remove('velocity-max');
      } else {
        telemetryCard.classList.remove('velocity-boost', 'velocity-max');
      }
    }

    // Decay APM smoothly when idle
    setInterval(() => {
      const now = performance.now();
      while (inputHistory.length > 0 && now - inputHistory[0] > 1200) {
        inputHistory.shift();
      }
      const currentAPM = Math.round((inputHistory.length / 1.2) * 60);
      apmDisplay.textContent = `${currentAPM} APM`;
      if (currentAPM < 110) {
        telemetryCard.classList.remove('velocity-boost', 'velocity-max');
      } else if (currentAPM < 220) {
        telemetryCard.classList.remove('velocity-max');
      }
    }, 250);

    function triggerComboBadge(text, duration = 480) {
      comboBadge.textContent = text;
      comboBadge.classList.add('active');
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        comboBadge.classList.remove('active');
      }, duration);
    }

    function setKey(name, active) {
      const el = elements[name];
      if (!el) return;

      if (active) {
        recordInputEvent();
        clearTimeout(trailTimers[name]);
        el.classList.remove('trail', 'superglide');
        el.classList.add('active');

        const now = performance.now();
        if (name === 'JUMP') {
          lastJumpTime = now;
          // Superglide Combo: Jump and Crouch struck within 45ms!
          if (Math.abs(lastJumpTime - lastCrouchTime) < 45) {
            el.classList.add('superglide');
            if (elements['CROUCH']) elements['CROUCH'].classList.add('superglide');
            triggerComboBadge('✦ SUPERGLIDE', 520);
          }
        } else if (name === 'CROUCH') {
          lastCrouchTime = now;
          if (Math.abs(lastJumpTime - lastCrouchTime) < 45) {
            el.classList.add('superglide');
            if (elements['JUMP']) elements['JUMP'].classList.add('superglide');
            triggerComboBadge('✦ SUPERGLIDE', 520);
          }
        }

        if (name === 'LMB' || name === 'RMB') {
          mouseShell.classList.add('firing');
        }
      } else {
        // Release: Instant un-press + Phosphor Trail Decay
        el.classList.remove('active');
        el.classList.add('trail');

        trailTimers[name] = setTimeout(() => {
          el.classList.remove('trail', 'superglide');
        }, 210);

        if (name === 'LMB' || name === 'RMB') {
          if (!elements['LMB'].classList.contains('active') && !elements['RMB'].classList.contains('active')) {
            mouseShell.classList.remove('firing');
          }
        }
      }
    }

    function triggerWheel(direction) {
      recordInputEvent();
      const wheel = elements['MOUSE_WHEEL'];

      if (direction === 'up') {
        const ind = elements['WHEEL_UP'];
        wheelUpTicks++;

        clearTimeout(wheelTickResetTimer);
        wheelTickResetTimer = setTimeout(() => {
          wheelUpTicks = 0;
          ind.classList.remove('surging');
        }, 150);

        // Tap-strafe rapid scroll velocity multiplier
        if (wheelUpTicks >= 3) {
          ind.classList.add('surging');
          triggerComboBadge('▲ TAP-STRAFE', 340);
        } else {
          ind.classList.add('active');
        }

        wheel.className = 'mouse-wheel-track up';
        clearTimeout(wheelUpTimer);
        wheelUpTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'mouse-wheel-track';
        }, 90);

      } else if (direction === 'down') {
        const ind = elements['WHEEL_DOWN'];
        ind.classList.add('active');
        wheel.className = 'mouse-wheel-track down';
        clearTimeout(wheelDownTimer);
        wheelDownTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'mouse-wheel-track';
        }, 90);
      }
    }

    // Connect to Win32 Input Daemon WebSocket
    function connectWS() {
      const ws = new WebSocket('ws://127.0.0.1:8998/ws');

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'key') {
            setKey(data.name, data.down);
          } else if (data.type === 'wheel') {
            triggerWheel(data.dir);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 1200);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectWS();

    // Local Window Fallback for Direct Browser Testing & Montage Previews
    window.addEventListener('keydown', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', true);
      if (k === 'A') setKey('A', true);
      if (k === 'S') setKey('S', true);
      if (k === 'D') setKey('D', true);
      if (k === 'P' || e.code === 'AltLeft' || e.altKey || k === 'Q') setKey('STIM', true);
      if (k === 'E') setKey('INTERACT', true);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', true);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', true);
      if (e.code === 'ShiftLeft') setKey('SPRINT', true);
      if (k === '1' || k === '2' || k === '3') setKey('WEAPON', true);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', false);
      if (k === 'A') setKey('A', false);
      if (k === 'S') setKey('S', false);
      if (k === 'D') setKey('D', false);
      if (k === 'P' || e.code === 'AltLeft' || !e.altKey || k === 'Q') setKey('STIM', false);
      if (k === 'E') setKey('INTERACT', false);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', false);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', false);
      if (e.code === 'ShiftLeft') setKey('SPRINT', false);
      if (k === '1' || k === '2' || k === '3') setKey('WEAPON', false);
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) setKey('LMB', true);
      if (e.button === 2) setKey('RMB', true);
      if (e.button === 3 || e.button === 4) setKey('WEAPON', true);
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) setKey('LMB', false);
      if (e.button === 2) setKey('RMB', false);
      if (e.button === 3 || e.button === 4) setKey('WEAPON', false);
    });

    window.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) triggerWheel('up');
      else if (e.deltaY > 0) triggerWheel('down');
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>

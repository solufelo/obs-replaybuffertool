<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captain Solo Minimalist Kinetic HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fixed 360x130 OBS Canvas - Strictly Bound, Zero Overflow */
    html, body {
      width: 360px;
      height: 130px;
      max-width: 360px;
      max-height: 130px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Esports HUD Container - Fully Transparent, Zero Clunky Borders */
    .hud-console {
      width: 354px;
      height: 122px;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Ultra-Slim Header / Minimal Dynamic Combo Strip */
    .hud-header {
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .hud-tag {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hud-beacon {
      width: 4px;
      height: 4px;
      background: #00F0FF;
      border-radius: 50%;
      box-shadow: 0 0 6px #00F0FF;
    }

    /* Subtle Floating Movement Combo Badge */
    .combo-badge {
      opacity: 0;
      font-size: 7.5px;
      font-weight: 800;
      color: #0A0C10;
      background: #FFFFFF;
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateY(-2px);
    }

    .combo-badge.active {
      opacity: 1;
      transform: translateY(0);
    }

    .combo-badge.cyan {
      background: #00F0FF;
      box-shadow: 0 0 12px #00F0FF;
    }

    /* Main HUD Body */
    .hud-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 104px;
      gap: 6px;
    }

    /* === LEFT POD: KEYBOARD MOVEMENT CLUSTER === */
    .keyboard-pod {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 254px;
    }

    .key-row {
      display: flex;
      align-items: center;
      height: 31px;
      gap: 4px;
    }

    /* Floating Transparent Keycaps (Smoked Translucent Glass, High Contrast) */
    .k-cap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 30px;
      background: rgba(12, 16, 24, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      transition: 
        background 0.22s cubic-bezier(0.12, 0.9, 0.2, 1),
        border-color 0.22s cubic-bezier(0.12, 0.9, 0.2, 1),
        box-shadow 0.24s cubic-bezier(0.12, 0.9, 0.2, 1),
        color 0.12s ease;
      cursor: default;
      overflow: hidden;
    }

    /* 0ms Instantaneous Peak Strike */
    .k-cap.active {
      background: #FFFFFF !important;
      color: #0A0C10 !important;
      border-color: #FFFFFF !important;
      font-weight: 800 !important;
      box-shadow: 
        0 0 14px rgba(255, 255, 255, 1),
        0 0 26px rgba(255, 255, 255, 0.6),
        inset 0 0 4px rgba(255, 255, 255, 0.9) !important;
      transition: none !important;
      z-index: 2;
    }

    /* Phosphor Kinetic Trail */
    .k-cap.trail {
      background: rgba(0, 240, 255, 0.25);
      border-color: rgba(0, 240, 255, 0.65);
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
    }

    /* Superglide Synchronized Surge */
    .k-cap.superglide {
      background: #00F0FF !important;
      color: #050B14 !important;
      border-color: #FFFFFF !important;
      box-shadow: 0 0 22px rgba(0, 240, 255, 1), 0 0 36px rgba(255, 255, 255, 0.8) !important;
      z-index: 3;
    }

    /* Directional Strafe Kinematics */
    .cap-strafe-l.active {
      box-shadow: -6px 0 20px rgba(0, 240, 255, 0.9), 0 0 14px #FFFFFF !important;
    }

    .cap-strafe-r.active {
      box-shadow: 6px 0 20px rgba(0, 240, 255, 0.9), 0 0 14px #FFFFFF !important;
    }

    .k-cap.strafe-chain {
      border-color: #00F0FF !important;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.8) !important;
    }

    /* Sturdy Key Sizing & Absolute WASD Symmetry */
    .k-wasd {
      width: 36px;
    }

    .k-stim {
      width: 86px;
      display: flex;
      flex-direction: row;
      gap: 3px;
    }
    .k-sub {
      font-size: 7.5px;
      font-weight: 700;
      opacity: 0.6;
    }
    .k-cap.active .k-sub {
      color: #0A0C10;
      opacity: 0.95;
    }

    .k-interact {
      width: 124px;
      font-size: 11px;
    }

    .k-sprint {
      width: 48px;
      font-size: 9.5px;
      letter-spacing: 0.08em;
    }

    .k-crouch {
      width: 86px;
      font-size: 9.5px;
      letter-spacing: 0.08em;
    }

    .k-holster {
      width: 48px;
      font-size: 9.5px;
      letter-spacing: 0.06em;
    }

    .k-jump {
      flex: 1;
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    /* Subtle Translucent Pod Divider */
    .hud-divider {
      width: 1px;
      height: 96px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.18) 20%, rgba(255, 255, 255, 0.18) 80%, transparent);
    }

    /* === RIGHT POD: VERTICAL WHEEL & MOUSE ENGINE === */
    .mouse-pod {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 88px;
      height: 100%;
    }

    /* Cohesive Vertical Scroll Pillar: Down = Jump, Up = Tap Strafe */
    .wheel-pillar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 46px;
    }

    .wheel-btn {
      height: 48px;
      background: rgba(12, 16, 24, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: default;
      transition: all 0.04s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .wheel-btn .w-glyph {
      font-size: 12px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.65);
    }

    .wheel-btn .w-lbl {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    /* Up = Tap-Strafe Active Flash */
    .wheel-btn.up.active {
      background: #00F0FF !important;
      border-color: #00F0FF !important;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.95), 0 0 30px rgba(0, 240, 255, 0.5) !important;
      transform: translateY(-1px);
    }
    .wheel-btn.up.active .w-glyph,
    .wheel-btn.up.active .w-lbl {
      color: #050B14 !important;
      font-weight: 900 !important;
    }

    /* Down = Jump / Bhop Active Flash */
    .wheel-btn.down.active {
      background: #FFFFFF !important;
      border-color: #FFFFFF !important;
      box-shadow: 0 0 16px rgba(255, 255, 255, 1), 0 0 28px rgba(255, 255, 255, 0.6) !important;
      transform: translateY(1px);
    }
    .wheel-btn.down.active .w-glyph,
    .wheel-btn.down.active .w-lbl {
      color: #0A0C10 !important;
      font-weight: 900 !important;
    }

    /* Floating Esports Mouse Chassis */
    .mouse-frame {
      position: relative;
      width: 32px;
      height: 98px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px 16px 11px 11px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(12, 16, 24, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .mouse-frame.firing {
      border-color: #00F0FF;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .mouse-keys {
      display: flex;
      width: 100%;
      height: 46px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .m-click {
      flex: 1;
      height: 100%;
      transition: background 0.02s ease;
    }
    .m-click.left {
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    .m-click.active {
      background: #FFFFFF !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 1);
    }

    .m-wheel-track {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      transition: all 0.03s ease;
    }
    .m-wheel-track.up {
      background: #00F0FF !important;
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 0 8px #00F0FF;
    }
    .m-wheel-track.down {
      background: #FFFFFF !important;
      transform: translateX(-50%) translateY(3px);
      box-shadow: 0 0 8px #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="hud-console">
    <!-- Top Micro Bar: Identity & Floating Combo Badge (Zero Bloat) -->
    <div class="hud-header">
      <div class="hud-tag">
        <div class="hud-beacon"></div>
        <span>CAPTAIN SOLO</span>
      </div>
      <div id="comboBadge" class="combo-badge">TAP-STRAFE</div>
    </div>

    <!-- Main HUD Cluster -->
    <div class="hud-body">
      <!-- LEFT POD: Keyboard Movement Cluster -->
      <div class="keyboard-pod">
        <!-- Row 1: Tactical [P / Alt], Forward [W], Interact [E] -->
        <div class="key-row">
          <div id="key-stim" class="k-cap k-stim" title="Tactical Ability (P / Left Alt)">
            <span>P</span>
            <span class="k-sub">TAC</span>
          </div>
          <div id="key-w" class="k-cap k-wasd">W</div>
          <div id="key-interact" class="k-cap k-interact">INTERACT</div>
        </div>

        <!-- Row 2: Sprint [Shift], Strafe Left [A], Backward [S], Strafe Right [D], Crouch [C / Ctrl] -->
        <div class="key-row">
          <div id="key-sprint" class="k-cap k-sprint">SHIFT</div>
          <div id="key-a" class="k-cap k-wasd cap-strafe-l">A</div>
          <div id="key-s" class="k-cap k-wasd">S</div>
          <div id="key-d" class="k-cap k-wasd cap-strafe-r">D</div>
          <div id="key-crouch" class="k-cap k-crouch">CROUCH</div>
        </div>

        <!-- Row 3: Holster [3], Ground Jump [Space] -->
        <div class="key-row">
          <div id="btn-weapon" class="k-cap k-holster" title="Holster / Cycle (3 / MB4)">3</div>
          <div id="key-jump" class="k-cap k-jump">JUMP</div>
        </div>
      </div>

      <!-- Divider -->
      <div class="hud-divider"></div>

      <!-- RIGHT POD: Vertical Wheel & Mouse Engine -->
      <div class="mouse-pod">
        <!-- Vertical Wheel Column: Down is Jump, Up is Tap-Strafe -->
        <div class="wheel-pillar">
          <div id="wheel-up" class="wheel-btn up" title="Scroll Up: Tap-Strafe">
            <span class="w-glyph">▲</span>
            <span class="w-lbl">TAP</span>
          </div>
          <div id="wheel-down" class="wheel-btn down" title="Scroll Down: Jump / Bhop">
            <span class="w-glyph">▼</span>
            <span class="w-lbl">JUMP</span>
          </div>
        </div>

        <!-- Sleek Wireframe Mouse Visualizer -->
        <div class="mouse-frame" id="mouseShell">
          <div class="mouse-keys">
            <div id="mouse-lmb" class="m-click left"></div>
            <div id="mouse-rmb" class="m-click right"></div>
          </div>
          <div id="mouse-wheel" class="m-wheel-track"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elements = {
      'W': document.getElementById('key-w'),
      'A': document.getElementById('key-a'),
      'S': document.getElementById('key-s'),
      'D': document.getElementById('key-d'),
      'STIM': document.getElementById('key-stim'),
      'SPRINT': document.getElementById('key-sprint'),
      'INTERACT': document.getElementById('key-interact'),
      'CROUCH': document.getElementById('key-crouch'),
      'JUMP': document.getElementById('key-jump'),
      'WEAPON': document.getElementById('btn-weapon'),
      'LMB': document.getElementById('mouse-lmb'),
      'RMB': document.getElementById('mouse-rmb'),
      'WHEEL_UP': document.getElementById('wheel-up'),
      'WHEEL_DOWN': document.getElementById('wheel-down'),
      'MOUSE_WHEEL': document.getElementById('mouse-wheel')
    };

    const comboBadge = document.getElementById('comboBadge');
    const mouseShell = document.getElementById('mouseShell');

    let wheelUpTimer = null;
    let wheelDownTimer = null;
    let lastJumpTime = 0;
    let lastCrouchTime = 0;
    let lastATime = 0;
    let lastDTime = 0;
    let comboTimer = null;
    const trailTimers = {};

    function triggerComboBadge(text, cyan = false, duration = 400) {
      comboBadge.textContent = text;
      if (cyan) {
        comboBadge.classList.add('cyan');
      } else {
        comboBadge.classList.remove('cyan');
      }
      comboBadge.classList.add('active');
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        comboBadge.classList.remove('active');
      }, duration);
    }

    function setKey(name, active) {
      const el = elements[name];
      if (!el) return;

      if (active) {
        clearTimeout(trailTimers[name]);
        el.classList.remove('trail', 'superglide');
        el.classList.add('active');

        const now = performance.now();

        // Flashy Counter-Strafe Dance Detection (A <-> D alternation)
        if (name === 'A') {
          lastATime = now;
          if (now - lastDTime < 240) {
            elements['A'].classList.add('strafe-chain');
            elements['D'].classList.add('strafe-chain');
            triggerComboBadge('⚡ STRAFE', true, 300);
          }
        } else if (name === 'D') {
          lastDTime = now;
          if (now - lastATime < 240) {
            elements['A'].classList.add('strafe-chain');
            elements['D'].classList.add('strafe-chain');
            triggerComboBadge('⚡ STRAFE', true, 300);
          }
        }

        // Superglide Combo: Jump and Crouch struck within 45ms
        if (name === 'JUMP') {
          lastJumpTime = now;
          if (Math.abs(lastJumpTime - lastCrouchTime) < 45) {
            el.classList.add('superglide');
            if (elements['CROUCH']) elements['CROUCH'].classList.add('superglide');
            triggerComboBadge('✦ SUPERGLIDE', true, 500);
          }
        } else if (name === 'CROUCH') {
          lastCrouchTime = now;
          if (Math.abs(lastJumpTime - lastCrouchTime) < 45) {
            el.classList.add('superglide');
            if (elements['JUMP']) elements['JUMP'].classList.add('superglide');
            triggerComboBadge('✦ SUPERGLIDE', true, 500);
          }
        }

        if (name === 'LMB' || name === 'RMB') {
          mouseShell.classList.add('firing');
        }
      } else {
        // Release: Instant un-press + Phosphor Trail Decay
        el.classList.remove('active', 'strafe-chain');
        el.classList.add('trail');

        trailTimers[name] = setTimeout(() => {
          el.classList.remove('trail', 'superglide');
        }, 200);

        if (name === 'LMB' || name === 'RMB') {
          if (!elements['LMB'].classList.contains('active') && !elements['RMB'].classList.contains('active')) {
            mouseShell.classList.remove('firing');
          }
        }
      }
    }

    function triggerWheel(direction) {
      const wheel = elements['MOUSE_WHEEL'];

      if (direction === 'up') {
        // UP = TAP-STRAFE
        const ind = elements['WHEEL_UP'];
        ind.classList.add('active');
        triggerComboBadge('▲ TAP-STRAFE', true, 320);

        wheel.className = 'm-wheel-track up';
        clearTimeout(wheelUpTimer);
        wheelUpTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'm-wheel-track';
        }, 90);

      } else if (direction === 'down') {
        // DOWN = JUMP / BHOP
        const ind = elements['WHEEL_DOWN'];
        ind.classList.add('active');
        triggerComboBadge('▼ JUMP', false, 320);

        wheel.className = 'm-wheel-track down';
        clearTimeout(wheelDownTimer);
        wheelDownTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'm-wheel-track';
        }, 90);
      }
    }

    // Connect to Win32 Input Daemon WebSocket
    function connectWS() {
      const ws = new WebSocket('ws://127.0.0.1:8998/ws');

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'key') {
            setKey(data.name, data.down);
          } else if (data.type === 'wheel') {
            triggerWheel(data.dir);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 1200);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectWS();

    // Browser Fallback for Testing / Direct Usage
    window.addEventListener('keydown', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', true);
      if (k === 'A') setKey('A', true);
      if (k === 'S') setKey('S', true);
      if (k === 'D') setKey('D', true);
      if (k === 'P' || e.code === 'AltLeft' || e.altKey || k === 'Q') setKey('STIM', true);
      if (k === 'E') setKey('INTERACT', true);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', true);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', true);
      if (e.code === 'ShiftLeft') setKey('SPRINT', true);
      if (k === '1' || k === '2' || k === '3') setKey('WEAPON', true);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', false);
      if (k === 'A') setKey('A', false);
      if (k === 'S') setKey('S', false);
      if (k === 'D') setKey('D', false);
      if (k === 'P' || e.code === 'AltLeft' || !e.altKey || k === 'Q') setKey('STIM', false);
      if (k === 'E') setKey('INTERACT', false);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', false);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', false);
      if (e.code === 'ShiftLeft') setKey('SPRINT', false);
      if (k === '1' || k === '2' || k === '3') setKey('WEAPON', false);
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) setKey('LMB', true);
      if (e.button === 2) setKey('RMB', true);
      if (e.button === 3 || e.button === 4) setKey('WEAPON', true);
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) setKey('LMB', false);
      if (e.button === 2) setKey('RMB', false);
      if (e.button === 3 || e.button === 4) setKey('WEAPON', false);
    });

    window.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) triggerWheel('up');
      else if (e.deltaY > 0) triggerWheel('down');
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>

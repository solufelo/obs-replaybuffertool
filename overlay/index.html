<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captain Solo Input Visualizer</title>
  <script src="theme.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      overflow: hidden;
      font-family: 'Rajdhani', 'Eurostile', 'DIN Alternate', 'Segoe UI Bold', 'Arial Black', sans-serif;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    /* THEME VARIABLES */
    body.theme-solo {
      --accent: #00E5FF;
      --accent-bg: rgba(0, 229, 255, 0.1);
      --accent-border: rgba(0, 229, 255, 0.35);
      --accent-glow: rgba(0, 229, 255, 0.25);
      --container-bg: rgba(10, 15, 24, 0.85);
      --container-border: rgba(0, 229, 255, 0.3);
      --container-glow: rgba(0, 229, 255, 0.12);
    }
    body.theme-octane {
      --accent: #00FF66;
      --accent-bg: rgba(0, 255, 102, 0.1);
      --accent-border: rgba(0, 255, 102, 0.45);
      --accent-glow: rgba(0, 255, 102, 0.25);
      --container-bg: rgba(10, 16, 12, 0.85);
      --container-border: rgba(0, 255, 102, 0.35);
      --container-glow: rgba(0, 255, 102, 0.12);
    }
    body.theme-stealth {
      --accent: #FFFFFF;
      --accent-bg: rgba(255, 255, 255, 0.1);
      --accent-border: rgba(255, 255, 255, 0.3);
      --accent-glow: rgba(255, 255, 255, 0.15);
      --container-bg: rgba(12, 12, 14, 0.9);
      --container-border: rgba(255, 255, 255, 0.2);
      --container-glow: rgba(255, 255, 255, 0.05);
    }

    /* Container */
    .overlay-container {
      display: inline-flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 14px;
      background: var(--container-bg);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 12px var(--container-glow);
      border: 1px solid var(--container-border);
      transition: all 0.3s ease;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
    }

    /* Standard Key Styling */
    .key-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      min-width: 30px;
      padding: 0 6px;
      font-size: 16px;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      transition: background 0.03s ease, color 0.03s ease, box-shadow 0.03s ease;
    }

    /* Standard Active Inverted White Key Highlight */
    .key-box.active {
      background: #FFFFFF !important;
      color: #000000 !important;
      font-weight: 900;
      text-shadow: none !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    .action-label {
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 0 8px;
      min-width: 65px;
    }

    /* Octane Stim Syringe Keybox */
    .stim-box {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      min-width: 78px;
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid rgba(0, 255, 102, 0.45);
      color: #FFFFFF;
      cursor: default;
    }

    .stim-box svg {
      width: 20px;
      height: 20px;
      transition: transform 0.04s ease;
    }

    .stim-box .stim-text {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    /* Stim / Ability Active State */
    .stim-box.active {
      background: var(--accent) !important;
      color: #0A0E14 !important;
      font-weight: 900;
      border-color: var(--accent) !important;
      box-shadow: 0 0 20px var(--accent), inset 0 0 8px rgba(255, 255, 255, 0.7) !important;
      text-shadow: none !important;
    }

    .stim-box.active svg {
      transform: scale(1.1) rotate(-5deg);
    }

    .stim-box.active svg path,
    .stim-box.active svg rect,
    .stim-box.active svg line,
    .stim-box.active svg circle {
      stroke: #0A0E14 !important;
      fill: #0A0E14 !important;
    }

    /* Octane Jump Pad & Actions */
    .jump-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex: 1;
      min-width: 90px;
    }

    .jump-box svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
    }

    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      width: 36px;
      color: #FFFFFF;
      fill: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }

    .icon-box svg {
      width: 20px;
      height: 18px;
      fill: currentColor;
    }

    .icon-box.active {
      background: #FFFFFF !important;
      color: #000000 !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    .icon-box.active svg {
      fill: #000000 !important;
    }

    /* Sprint Chevrons */
    .sprint-box {
      min-width: 32px;
      font-size: 15px;
      color: var(--accent);
      border-color: var(--accent-border);
    }

    .sprint-box.active {
      background: var(--accent) !important;
      color: #0A0E14 !important;
      box-shadow: 0 0 14px var(--accent) !important;
    }

    /* Mouse Visualizer */
    .mouse-hud {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      padding-left: 6px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    .mouse-body {
      position: relative;
      width: 24px;
      height: 38px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px 12px 10px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mouse-top {
      display: flex;
      width: 100%;
      height: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    }

    .mouse-btn {
      flex: 1;
      height: 100%;
      transition: background 0.03s ease;
    }

    .mouse-btn.left {
      border-right: 1px solid rgba(255, 255, 255, 0.4);
    }

    .mouse-btn.active {
      background: #FFFFFF !important;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .mouse-wheel {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 9px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
      transition: background 0.04s ease, transform 0.04s ease, box-shadow 0.04s ease;
    }

    .mouse-wheel.up {
      background: var(--accent) !important;
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 0 10px var(--accent);
    }

    .mouse-wheel.down {
      background: var(--accent) !important;
      transform: translateX(-50%) translateY(2px);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Scroll Indicators */
    .wheel-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      transition: all 0.05s ease;
    }

    .wheel-indicator.active {
      color: #0A0E14;
      background: var(--accent);
      font-weight: 900;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <!-- Row 1: Octane Stim Syringe (Left Alt / P), W, INTERACT, Tap-Strafe Wheel Up, Mouse -->
    <div class="row">
      <!-- Octane Stim Syringe -->
      <div id="key-stim" class="key-box stim-box" title="Octane Stim (Left Alt / P)">
        <svg class="stim-icon" viewBox="0 0 32 32">
          <!-- Needle -->
          <path d="M5 27 L10 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          <!-- Needle Hub -->
          <path d="M9 23 L11 25 L13 23 L11 21 Z" fill="#FFFFFF"/>
          <!-- Fluid Barrel with Toxic Green Core -->
          <rect x="11" y="9" width="10" height="6" transform="rotate(-45 16 12)" fill="#00FF66" stroke="#FFFFFF" stroke-width="1.5" rx="1"/>
          <!-- Liquid Core Line -->
          <line x1="12" y1="20" x2="20" y2="12" stroke="#39FF14" stroke-width="2" stroke-linecap="round"/>
          <!-- Flanges / Grip -->
          <path d="M19 9 L25 15 L23 17 L17 11 Z" fill="#FFFFFF"/>
          <!-- Plunger Shaft & Ring -->
          <line x1="23" y1="11" x2="27" y2="7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="28" cy="6" r="2.5" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
        </svg>
        <span class="stim-text">STIM</span>
      </div>

      <div id="key-w" class="key-box">W</div>
      <div id="key-interact" class="key-box action-label">INTERACT</div>
      <div id="wheel-up" class="wheel-indicator" title="Tap-Strafe (Wheel Up)">▲</div>
      
      <!-- Mouse Visualizer -->
      <div class="mouse-hud">
        <div class="mouse-body">
          <div class="mouse-top">
            <div id="mouse-lmb" class="mouse-btn left"></div>
            <div id="mouse-rmb" class="mouse-btn right"></div>
          </div>
          <div id="mouse-wheel" class="mouse-wheel"></div>
        </div>
      </div>
    </div>

    <!-- Row 2: >> Sprint, A, S, D, CROUCH -->
    <div class="row">
      <div id="key-sprint" class="key-box sprint-box" title="Sprint (Shift)">&gt;&gt;</div>
      <div id="key-a" class="key-box">A</div>
      <div id="key-s" class="key-box">S</div>
      <div id="key-d" class="key-box">D</div>
      <div id="key-crouch" class="key-box action-label">CROUCH</div>
    </div>

    <!-- Row 3: Weapon / Holster, JUMP (Space / Launch Pad), Wheel Down (Bhop) -->
    <div class="row">
      <div id="btn-weapon" class="icon-box" title="Weapon / Holster (1, 2, 3, MB4)">
        <svg viewBox="0 0 24 24">
          <path d="M21 7l-2-2H8l-2 2H2v4h4l2-2h4v2l3 1v3h3v-4l3-2V7zm-9 2H9l1-1h2v1z"/>
        </svg>
      </div>

      <!-- Jump / Octane Launch Pad -->
      <div id="key-jump" class="key-box action-label jump-box" title="Jump / Launch Pad (Space)">
        <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; fill: none;">
          <circle cx="12" cy="12" r="8" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="3" fill="#00FF66"/>
          <path d="M8 14 L12 10 L16 14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>JUMP</span>
      </div>

      <div id="wheel-down" class="wheel-indicator" title="Bhop / Jump (Wheel Down)">▼</div>
    </div>
  </div>

  <script>
    const elements = {
      'W': document.getElementById('key-w'),
      'A': document.getElementById('key-a'),
      'S': document.getElementById('key-s'),
      'D': document.getElementById('key-d'),
      'STIM': document.getElementById('key-stim'),
      'SPRINT': document.getElementById('key-sprint'),
      'INTERACT': document.getElementById('key-interact'),
      'CROUCH': document.getElementById('key-crouch'),
      'JUMP': document.getElementById('key-jump'),
      'WEAPON': document.getElementById('btn-weapon'),
      'LMB': document.getElementById('mouse-lmb'),
      'RMB': document.getElementById('mouse-rmb'),
      'WHEEL_UP': document.getElementById('wheel-up'),
      'WHEEL_DOWN': document.getElementById('wheel-down'),
      'MOUSE_WHEEL': document.getElementById('mouse-wheel')
    };

    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || window.ACTIVE_THEME || 'solo';
    document.body.className = `theme-${theme}`;

    if (theme === 'solo') {
      const stim = document.getElementById('key-stim');
      stim.title = "Tactical Ability (Left Alt / P / Q)";
      stim.innerHTML = `
        <svg class="stim-icon" viewBox="0 0 24 24" style="width: 17px; height: 17px; fill: var(--accent);">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span class="stim-text" style="color: var(--accent);">ABIL</span>
      `;
      const jump = document.getElementById('key-jump');
      jump.title = "Jump (Space)";
      jump.innerHTML = `
        <svg viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
        <span>JUMP</span>
      `;
    } else if (theme === 'stealth') {
      const stim = document.getElementById('key-stim');
      stim.title = "Tactical Ability";
      stim.innerHTML = `
        <svg class="stim-icon" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke: #FFFFFF; fill: none; stroke-width: 2;">
          <path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/>
        </svg>
        <span class="stim-text">ABILITY</span>
      `;
      const jump = document.getElementById('key-jump');
      jump.title = "Jump (Space)";
      jump.innerHTML = `
        <svg viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke: #FFFFFF; fill: none; stroke-width: 2;">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
        <span>JUMP</span>
      `;
    }

    let wheelUpTimer = null;
    let wheelDownTimer = null;

    function setKey(name, active) {
      const el = elements[name];
      if (el) {
        if (active) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      }
    }

    function triggerWheel(direction) {
      const wheel = elements['MOUSE_WHEEL'];
      if (direction === 'up') {
        const ind = elements['WHEEL_UP'];
        ind.classList.add('active');
        wheel.className = 'mouse-wheel up';
        clearTimeout(wheelUpTimer);
        wheelUpTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'mouse-wheel';
        }, 90);
      } else if (direction === 'down') {
        const ind = elements['WHEEL_DOWN'];
        ind.classList.add('active');
        wheel.className = 'mouse-wheel down';
        clearTimeout(wheelDownTimer);
        wheelDownTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'mouse-wheel';
        }, 90);
      }
    }

    // Connect to local WebSocket input daemon
    function connectWS() {
      const ws = new WebSocket('ws://127.0.0.1:8998/ws');

      ws.onopen = () => {
        console.log('[OctaneOverlay] Connected to input daemon on 8998');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'key') {
            setKey(data.name, data.down);
          } else if (data.type === 'wheel') {
            triggerWheel(data.dir);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 1200);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectWS();

    // Local Browser Event Listener for standalone preview & debugging
    window.addEventListener('keydown', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', true);
      if (k === 'A') setKey('A', true);
      if (k === 'S') setKey('S', true);
      if (k === 'D') setKey('D', true);
      if (k === 'P' || e.code === 'AltLeft' || e.altKey || k === 'Q') setKey('STIM', true);
      if (k === 'E') setKey('INTERACT', true);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', true);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', true);
      if (e.code === 'ShiftLeft') setKey('SPRINT', true);
      if (k === '1' || k === '2' || k === '3') setKey('WEAPON', true);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', false);
      if (k === 'A') setKey('A', false);
      if (k === 'S') setKey('S', false);
      if (k === 'D') setKey('D', false);
      if (k === 'P' || e.code === 'AltLeft' || !e.altKey || k === 'Q') setKey('STIM', false);
      if (k === 'E') setKey('INTERACT', false);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', false);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', false);
      if (e.code === 'ShiftLeft') setKey('SPRINT', false);
      if (k === '1' || k === '2' || k === '3') setKey('WEAPON', false);
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) setKey('LMB', true);
      if (e.button === 2) setKey('RMB', true);
      if (e.button === 3 || e.button === 4) setKey('WEAPON', true);
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) setKey('LMB', false);
      if (e.button === 2) setKey('RMB', false);
      if (e.button === 3 || e.button === 4) setKey('WEAPON', false);
    });

    window.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) triggerWheel('up');
      else if (e.deltaY > 0) triggerWheel('down');
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captain Solo Kinetic HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fixed 360x130 OBS Canvas - Strictly Bound, Zero Overflow */
    html, body {
      width: 360px;
      height: 130px;
      max-width: 360px;
      max-height: 130px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Esports HUD Container - Fully Transparent */
    .hud-console {
      width: 354px;
      height: 122px;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Header: Logo, Identity, Dynamic Combo Tag, and Beloved Momentum Meter */
    .hud-header {
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .hud-tag {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .brand-logo {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
    }

    .hud-beacon {
      width: 4px;
      height: 4px;
      background: #00F0FF;
      border-radius: 50%;
      box-shadow: 0 0 6px #00F0FF;
    }

    /* Floating Movement Combo Badge */
    .combo-badge {
      opacity: 0;
      font-size: 7.5px;
      font-weight: 800;
      color: #0A0C10;
      background: #FFFFFF;
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateY(-2px);
    }

    .combo-badge.active {
      opacity: 1;
      transform: translateY(0);
    }

    .combo-badge.cyan {
      background: #00F0FF;
      box-shadow: 0 0 12px #00F0FF;
    }

    .combo-badge.gold {
      background: #FFD700;
      color: #0A0C10;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.9);
    }

    /* Kinetic Momentum Gauge */
    .momentum-meter {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .meter-label {
      font-size: 7px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .meter-bars {
      display: flex;
      gap: 2px;
    }

    .meter-seg {
      width: 4px;
      height: 7px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 1px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .meter-seg.lit-1 { background: rgba(0, 240, 255, 0.7); box-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
    .meter-seg.lit-2 { background: rgba(0, 240, 255, 0.95); box-shadow: 0 0 7px rgba(0, 240, 255, 0.75); }
    .meter-seg.lit-3 { background: #FFFFFF; box-shadow: 0 0 9px #FFFFFF; }
    .meter-seg.lit-4 { background: #FFFFFF; box-shadow: 0 0 12px #FFFFFF; }

    /* Main HUD Body */
    .hud-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 103px;
      gap: 6px;
    }

    /* === LEFT POD: KEYBOARD MOVEMENT CLUSTER === */
    .keyboard-pod {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      flex: 1;
    }

    .key-row {
      display: flex;
      align-items: center;
      height: 31px;
      gap: 4px;
    }

    /* Floating Transparent Keycaps (Smoked Translucent Glass, High Contrast) */
    .k-cap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 30px;
      background: rgba(12, 16, 24, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      transition: 
        background 0.22s cubic-bezier(0.12, 0.9, 0.2, 1),
        border-color 0.22s cubic-bezier(0.12, 0.9, 0.2, 1),
        box-shadow 0.24s cubic-bezier(0.12, 0.9, 0.2, 1),
        color 0.12s ease;
      cursor: default;
      overflow: hidden;
    }

    /* 0ms Instantaneous Peak Strike */
    .k-cap.active {
      background: #FFFFFF !important;
      color: #0A0C10 !important;
      border-color: #FFFFFF !important;
      font-weight: 800 !important;
      box-shadow: 
        0 0 14px rgba(255, 255, 255, 1),
        0 0 26px rgba(255, 255, 255, 0.6),
        inset 0 0 4px rgba(255, 255, 255, 0.9) !important;
      transition: none !important;
      z-index: 2;
    }

    /* Phosphor Kinetic Trail */
    .k-cap.trail {
      background: rgba(0, 240, 255, 0.25);
      border-color: rgba(0, 240, 255, 0.65);
      color: #FFFFFF;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
    }

    /* Superglide Synchronized Surge (Persistent Frame-Lock) */
    .k-cap.superglide {
      background: #00F0FF !important;
      color: #050B14 !important;
      border-color: #FFFFFF !important;
      box-shadow: 0 0 24px rgba(0, 240, 255, 1), 0 0 40px rgba(255, 255, 255, 0.9) !important;
      z-index: 4;
      transition: none !important;
    }

    /* Directional Strafe Kinematics */
    .cap-strafe-l.active {
      box-shadow: -6px 0 20px rgba(0, 240, 255, 0.9), 0 0 14px #FFFFFF !important;
    }

    .cap-strafe-r.active {
      box-shadow: 6px 0 20px rgba(0, 240, 255, 0.9), 0 0 14px #FFFFFF !important;
    }

    .k-cap.strafe-chain {
      border-color: #00F0FF !important;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.8) !important;
    }

    /* Precise Proportions & Balanced Grid */
    .k-wasd {
      width: 36px;
    }

    .k-stim {
      width: 86px;
      display: flex;
      flex-direction: row;
      gap: 3px;
    }
    .k-sub {
      font-size: 7px;
      font-weight: 700;
      opacity: 0.6;
    }
    .k-cap.active .k-sub {
      color: #0A0C10;
      opacity: 0.95;
    }

    .k-interact {
      width: 124px;
      font-size: 11px;
    }

    /* Shift: Dedicated Zoom / Walk Keycap */
    .k-zoom {
      width: 52px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .k-zoom .k-sub {
      font-size: 6.5px;
      letter-spacing: 0.04em;
    }

    /* Crouch: Slimmed Down, Perfectly Proportioned */
    .k-crouch-slim {
      width: 58px;
      display: flex;
      flex-direction: row;
      gap: 3px;
    }

    .k-holster {
      width: 48px;
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    .k-heal {
      width: 44px;
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    .k-jump {
      flex: 1;
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    /* Divider */
    .hud-divider {
      width: 1px;
      height: 96px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.18) 20%, rgba(255, 255, 255, 0.18) 80%, transparent);
    }

    /* === RIGHT POD: VERTICAL WHEEL & MOUSE ENGINE === */
    .mouse-pod {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 88px;
      height: 100%;
    }

    /* Cohesive Vertical Scroll Pillar: Down = Jump, Up = Tap-Strafe */
    .wheel-pillar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 46px;
    }

    .wheel-btn {
      height: 48px;
      background: rgba(12, 16, 24, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: default;
      transition: all 0.04s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .wheel-btn .w-glyph {
      font-size: 12px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.65);
    }

    .wheel-btn .w-lbl {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }

    /* Up = Tap-Strafe */
    .wheel-btn.up.active {
      background: #00F0FF !important;
      border-color: #00F0FF !important;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.95), 0 0 30px rgba(0, 240, 255, 0.5) !important;
      transform: translateY(-1px);
    }
    .wheel-btn.up.active .w-glyph,
    .wheel-btn.up.active .w-lbl {
      color: #050B14 !important;
      font-weight: 900 !important;
    }

    /* Down = Jump / Bhop */
    .wheel-btn.down.active {
      background: #FFFFFF !important;
      border-color: #FFFFFF !important;
      box-shadow: 0 0 16px rgba(255, 255, 255, 1), 0 0 28px rgba(255, 255, 255, 0.6) !important;
      transform: translateY(1px);
    }
    .wheel-btn.down.active .w-glyph,
    .wheel-btn.down.active .w-lbl {
      color: #0A0C10 !important;
      font-weight: 900 !important;
    }

    /* Floating Esports Mouse Chassis with Side Buttons (MB4 & MB5) */
    .mouse-frame {
      position: relative;
      width: 32px;
      height: 98px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px 16px 11px 11px;
      display: flex;
      flex-direction: column;
      overflow: visible;
      background: rgba(12, 16, 24, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .mouse-frame.firing {
      border-color: #00F0FF;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .mouse-keys {
      display: flex;
      width: 100%;
      height: 46px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .m-click {
      flex: 1;
      height: 100%;
      transition: background 0.02s ease;
    }
    .m-click.left {
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    .m-click.active {
      background: #FFFFFF !important;
      box-shadow: 0 0 12px rgba(255, 255, 255, 1);
    }

    .m-wheel-track {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      transition: all 0.03s ease;
    }
    .m-wheel-track.up {
      background: #00F0FF !important;
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 0 8px #00F0FF;
    }
    .m-wheel-track.down {
      background: #FFFFFF !important;
      transform: translateX(-50%) translateY(3px);
      box-shadow: 0 0 8px #FFFFFF;
    }

    /* Mouse Side Button Pips: MB5 (Heal - top), MB4 (Holster - bottom) */
    .m-side-btn {
      position: absolute;
      left: -4px;
      width: 3px;
      height: 12px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 2px 0 0 2px;
      transition: all 0.03s ease;
    }
    .m-side-btn.mb5 { top: 32px; }
    .m-side-btn.mb4 { top: 48px; }

    .m-side-btn.active {
      background: #00F0FF !important;
      box-shadow: 0 0 8px #00F0FF;
      width: 4px;
      left: -5px;
    }
  </style>
</head>
<body>
  <div class="hud-console">
    <!-- Header: Logo, Identity, Dynamic Combo Tag, and Beloved Momentum Meter -->
    <div class="hud-header">
      <div class="hud-tag">
        <img class="brand-logo" src="assets/captain_solo_logo.png" alt="Solo Logo">
        <span>CAPTAIN SOLO</span>
      </div>
      <div id="comboBadge" class="combo-badge">TAP-STRAFE</div>
      <div class="momentum-meter">
        <span class="meter-label">MOMENTUM</span>
        <div class="meter-bars">
          <div class="meter-seg" id="seg1"></div>
          <div class="meter-seg" id="seg2"></div>
          <div class="meter-seg" id="seg3"></div>
          <div class="meter-seg" id="seg4"></div>
        </div>
      </div>
    </div>

    <!-- Main HUD Cluster -->
    <div class="hud-body">
      <!-- LEFT POD: Keyboard Movement Cluster -->
      <div class="keyboard-pod">
        <!-- Row 1: Tactical [P / Alt], Forward [W], Interact [E] -->
        <div class="key-row">
          <div id="key-stim" class="k-cap k-stim" title="Tactical Ability (P / Left Alt)">
            <span>P</span>
            <span class="k-sub">TAC</span>
          </div>
          <div id="key-w" class="k-cap k-wasd">W</div>
          <div id="key-interact" class="k-cap k-interact">INTERACT</div>
        </div>

        <!-- Row 2: Zoom/Walk [Shift], Strafe Left [A], Backward [S], Strafe Right [D], Crouch [C / Ctrl] -->
        <div class="key-row">
          <div id="key-sprint" class="k-cap k-zoom" title="Shift: Scope Zoom & Walk">
            <span>SHIFT</span>
            <span class="k-sub">ZOOM/WALK</span>
          </div>
          <div id="key-a" class="k-cap k-wasd cap-strafe-l">A</div>
          <div id="key-s" class="k-cap k-wasd">S</div>
          <div id="key-d" class="k-cap k-wasd cap-strafe-r">D</div>
          <div id="key-crouch" class="k-cap k-crouch-slim" title="Crouch / Slide (C / Ctrl)">
            <span>C</span>
            <span class="k-sub">SLIDE</span>
          </div>
        </div>

        <!-- Row 3: Holster [3 / MB4], Heal [4 / MB5], Ground Jump [Space] -->
        <div class="key-row">
          <div id="btn-holster" class="k-cap k-holster" title="Holster / Stow (3 / MB4)">
            <span>3</span>
            <span class="k-sub">STOW</span>
          </div>
          <div id="btn-heal" class="k-cap k-heal" title="Heal Kit (4 / MB5)">
            <span>4</span>
            <span class="k-sub">HEAL</span>
          </div>
          <div id="key-jump" class="k-cap k-jump">JUMP</div>
        </div>
      </div>

      <!-- Divider -->
      <div class="hud-divider"></div>

      <!-- RIGHT POD: Vertical Wheel & Mouse Engine -->
      <div class="mouse-pod">
        <!-- Vertical Wheel Column: Down is Jump, Up is Tap-Strafe -->
        <div class="wheel-pillar">
          <div id="wheel-up" class="wheel-btn up" title="Scroll Up: Tap-Strafe">
            <span class="w-glyph">▲</span>
            <span class="w-lbl">TAP</span>
          </div>
          <div id="wheel-down" class="wheel-btn down" title="Scroll Down: Jump / Bhop">
            <span class="w-glyph">▼</span>
            <span class="w-lbl">JUMP</span>
          </div>
        </div>

        <!-- Sleek Wireframe Mouse Visualizer with MB4/MB5 -->
        <div class="mouse-frame" id="mouseShell">
          <div id="side-mb5" class="m-side-btn mb5" title="MB5: Heal"></div>
          <div id="side-mb4" class="m-side-btn mb4" title="MB4: Holster"></div>
          <div class="mouse-keys">
            <div id="mouse-lmb" class="m-click left"></div>
            <div id="mouse-rmb" class="m-click right"></div>
          </div>
          <div id="mouse-wheel" class="m-wheel-track"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elements = {
      'W': document.getElementById('key-w'),
      'A': document.getElementById('key-a'),
      'S': document.getElementById('key-s'),
      'D': document.getElementById('key-d'),
      'STIM': document.getElementById('key-stim'),
      'SPRINT': document.getElementById('key-sprint'),
      'INTERACT': document.getElementById('key-interact'),
      'CROUCH': document.getElementById('key-crouch'),
      'JUMP': document.getElementById('key-jump'),
      'HOLSTER': document.getElementById('btn-holster'),
      'HEAL': document.getElementById('btn-heal'),
      'MB4': document.getElementById('side-mb4'),
      'MB5': document.getElementById('side-mb5'),
      'LMB': document.getElementById('mouse-lmb'),
      'RMB': document.getElementById('mouse-rmb'),
      'WHEEL_UP': document.getElementById('wheel-up'),
      'WHEEL_DOWN': document.getElementById('wheel-down'),
      'MOUSE_WHEEL': document.getElementById('mouse-wheel')
    };

    const comboBadge = document.getElementById('comboBadge');
    const mouseShell = document.getElementById('mouseShell');
    const segs = [
      document.getElementById('seg1'),
      document.getElementById('seg2'),
      document.getElementById('seg3'),
      document.getElementById('seg4')
    ];

    let wheelUpTimer = null;
    let wheelDownTimer = null;
    const inputHistory = [];
    let lastJumpTime = 0;
    let lastCrouchTime = 0;
    let lastATime = 0;
    let lastDTime = 0;
    let comboTimer = null;
    let isSupergliding = false;
    let superglideLockTimer = null;
    const trailTimers = {};

    function recordInputEvent() {
      const now = performance.now();
      inputHistory.push(now);

      while (inputHistory.length > 0 && now - inputHistory[0] > 1100) {
        inputHistory.shift();
      }

      const count = inputHistory.length;
      segs[0].className = count >= 2 ? 'meter-seg lit-1' : 'meter-seg';
      segs[1].className = count >= 5 ? 'meter-seg lit-2' : 'meter-seg';
      segs[2].className = count >= 8 ? 'meter-seg lit-3' : 'meter-seg';
      segs[3].className = count >= 12 ? 'meter-seg lit-4' : 'meter-seg';
    }

    setInterval(() => {
      const now = performance.now();
      while (inputHistory.length > 0 && now - inputHistory[0] > 1100) {
        inputHistory.shift();
      }
      const count = inputHistory.length;
      segs[0].className = count >= 2 ? 'meter-seg lit-1' : 'meter-seg';
      segs[1].className = count >= 5 ? 'meter-seg lit-2' : 'meter-seg';
      segs[2].className = count >= 8 ? 'meter-seg lit-3' : 'meter-seg';
      segs[3].className = count >= 12 ? 'meter-seg lit-4' : 'meter-seg';
    }, 180);

    function triggerComboBadge(text, style = 'cyan', duration = 400) {
      comboBadge.textContent = text;
      comboBadge.className = 'combo-badge active ' + style;
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        comboBadge.className = 'combo-badge';
      }, duration);
    }

    function triggerSuperglideLock() {
      isSupergliding = true;
      if (elements['JUMP']) elements['JUMP'].classList.add('superglide');
      if (elements['CROUCH']) elements['CROUCH'].classList.add('superglide');
      triggerComboBadge('✦ SUPERGLIDE', 'cyan', 600);

      clearTimeout(superglideLockTimer);
      superglideLockTimer = setTimeout(() => {
        isSupergliding = false;
        if (elements['JUMP'] && !elements['JUMP'].classList.contains('active')) {
          elements['JUMP'].classList.remove('superglide');
        }
        if (elements['CROUCH'] && !elements['CROUCH'].classList.contains('active')) {
          elements['CROUCH'].classList.remove('superglide');
        }
      }, 380);
    }

    const KEY_ALIASES = {
      'C': 'CROUCH',
      'CTRL': 'CROUCH',
      'SPACE': 'JUMP',
      'SHIFT': 'SPRINT',
      'E': 'INTERACT',
      'P': 'STIM',
      'ALT': 'STIM',
      'Q': 'STIM',
      '3': 'HOLSTER',
      '4': 'HEAL'
    };

    function setKey(rawName, active) {
      const name = KEY_ALIASES[rawName] || rawName;
      recordInputEvent();
      const el = elements[name];

      // Side Button Sync: MB4 activates HOLSTER, MB5 activates HEAL
      if (name === 'HOLSTER' || rawName === 'MB4') {
        if (elements['MB4']) {
          if (active) elements['MB4'].classList.add('active');
          else elements['MB4'].classList.remove('active');
        }
      } else if (name === 'HEAL' || rawName === 'MB5') {
        if (elements['MB5']) {
          if (active) elements['MB5'].classList.add('active');
          else elements['MB5'].classList.remove('active');
        }
      }

      if (!el) return;

      if (active) {
        clearTimeout(trailTimers[name]);
        el.classList.remove('trail');
        el.classList.add('active');

        const now = performance.now();

        // High-Precision Superglide Macro Sync (85ms window + simultaneous check)
        if (name === 'JUMP') {
          lastJumpTime = now;
          const crouchActive = elements['CROUCH'] && elements['CROUCH'].classList.contains('active');
          if (crouchActive || Math.abs(lastJumpTime - lastCrouchTime) < 85) {
            triggerSuperglideLock();
          }
        } else if (name === 'CROUCH') {
          lastCrouchTime = now;
          const jumpActive = elements['JUMP'] && elements['JUMP'].classList.contains('active');
          if (jumpActive || Math.abs(lastJumpTime - lastCrouchTime) < 85) {
            triggerSuperglideLock();
          }
        }

        // Counter-Strafe Dance Detection (A <-> D alternation)
        if (name === 'A') {
          lastATime = now;
          if (now - lastDTime < 240) {
            elements['A'].classList.add('strafe-chain');
            elements['D'].classList.add('strafe-chain');
            triggerComboBadge('⚡ STRAFE', 'cyan', 300);
          }
        } else if (name === 'D') {
          lastDTime = now;
          if (now - lastATime < 240) {
            elements['A'].classList.add('strafe-chain');
            elements['D'].classList.add('strafe-chain');
            triggerComboBadge('⚡ STRAFE', 'cyan', 300);
          }
        }

        if (name === 'LMB' || name === 'RMB') {
          mouseShell.classList.add('firing');
        }
      } else {
        // Release: Instant un-press
        el.classList.remove('active', 'strafe-chain');
        if (!isSupergliding) {
          el.classList.remove('superglide');
        }
        el.classList.add('trail');

        trailTimers[name] = setTimeout(() => {
          el.classList.remove('trail');
          if (!isSupergliding) {
            el.classList.remove('superglide');
          }
        }, 200);

        if (name === 'LMB' || name === 'RMB') {
          if (!elements['LMB'].classList.contains('active') && !elements['RMB'].classList.contains('active')) {
            mouseShell.classList.remove('firing');
          }
        }
      }
    }

    function triggerWheel(direction) {
      recordInputEvent();
      const wheel = elements['MOUSE_WHEEL'];

      if (direction === 'up') {
        // UP = TAP-STRAFE
        const ind = elements['WHEEL_UP'];
        ind.classList.add('active');
        triggerComboBadge('▲ TAP-STRAFE', 'cyan', 320);

        wheel.className = 'm-wheel-track up';
        clearTimeout(wheelUpTimer);
        wheelUpTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'm-wheel-track';
        }, 90);

      } else if (direction === 'down') {
        // DOWN = JUMP / BHOP
        const ind = elements['WHEEL_DOWN'];
        ind.classList.add('active');
        triggerComboBadge('▼ JUMP', 'gold', 320);

        wheel.className = 'm-wheel-track down';
        clearTimeout(wheelDownTimer);
        wheelDownTimer = setTimeout(() => {
          ind.classList.remove('active');
          wheel.className = 'm-wheel-track';
        }, 90);
      }
    }

    // Connect to Win32 Input Daemon WebSocket
    function connectWS() {
      const ws = new WebSocket('ws://127.0.0.1:8998/ws');

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'key') {
            setKey(data.name, data.down);
          } else if (data.type === 'wheel') {
            triggerWheel(data.dir);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 1200);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectWS();

    // Browser Fallback for Testing / Direct Usage
    window.addEventListener('keydown', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', true);
      if (k === 'A') setKey('A', true);
      if (k === 'S') setKey('S', true);
      if (k === 'D') setKey('D', true);
      if (k === 'P' || e.code === 'AltLeft' || e.altKey || k === 'Q') setKey('STIM', true);
      if (k === 'E') setKey('INTERACT', true);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', true);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', true);
      if (e.code === 'ShiftLeft') setKey('SPRINT', true);
      if (k === '3') setKey('HOLSTER', true);
      if (k === '4') setKey('HEAL', true);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', false);
      if (k === 'A') setKey('A', false);
      if (k === 'S') setKey('S', false);
      if (k === 'D') setKey('D', false);
      if (k === 'P' || e.code === 'AltLeft' || !e.altKey || k === 'Q') setKey('STIM', false);
      if (k === 'E') setKey('INTERACT', false);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', false);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', false);
      if (e.code === 'ShiftLeft') setKey('SPRINT', false);
      if (k === '3') setKey('HOLSTER', false);
      if (k === '4') setKey('HEAL', false);
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) setKey('LMB', true);
      if (e.button === 2) setKey('RMB', true);
      if (e.button === 3) setKey('HOLSTER', true); // MB4
      if (e.button === 4) setKey('HEAL', true);    // MB5
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) setKey('LMB', false);
      if (e.button === 2) setKey('RMB', false);
      if (e.button === 3) setKey('HOLSTER', false); // MB4
      if (e.button === 4) setKey('HEAL', false);    // MB5
    });

    window.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) triggerWheel('up');
      else if (e.deltaY > 0) triggerWheel('down');
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>

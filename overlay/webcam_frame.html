<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octane Pro Webcam Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      width: 360px;
      height: 266px;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      position: relative;
    }
    .frame-container {
      position: absolute;
      inset: 2px;
      border-radius: 8px;
      border: 2px solid rgba(0, 255, 102, 0.55);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.25), inset 0 0 14px rgba(0, 255, 102, 0.15);
      pointer-events: none;
    }
    /* Cyberpunk / Octane Corner Brackets */
    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 3px solid #00FF66;
      box-shadow: 0 0 8px #00FF66;
    }
    .top-left {
      top: -2px;
      left: -2px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 8px;
    }
    .top-right {
      top: -2px;
      right: -2px;
      border-left: none;
      border-bottom: none;
      border-top-right-radius: 8px;
    }
    .bottom-left {
      bottom: -2px;
      left: -2px;
      border-right: none;
      border-top: none;
      border-bottom-left-radius: 8px;
    }
    .bottom-right {
      bottom: -2px;
      right: -2px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 8px;
    }
    /* Top Header Badge */
    .header-badge {
      position: absolute;
      top: 6px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 14, 20, 0.85);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #FF0055;
      border-radius: 50%;
      box-shadow: 0 0 6px #FF0055;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .live-text {
      font-size: 10px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 1px;
    }
    .name-text {
      font-size: 11px;
      font-weight: 800;
      color: #00FF66;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding-left: 4px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }
    /* Bottom Subtext / Rank */
    .footer-badge {
      position: absolute;
      bottom: 6px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(10, 14, 20, 0.85);
      backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .footer-text {
      font-size: 10px;
      font-weight: 800;
      color: #D1D5DB;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .footer-accent {
      color: #00FF66;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="header-badge">
      <div class="dot"></div>
      <span class="live-text">LIVE</span>
      <span class="name-text">caaptainsolo</span>
    </div>

    <div class="footer-badge">
      <span class="footer-text">Octane Demon <span class="footer-accent">⚡</span></span>
    </div>
  </div>
</body>
</html>

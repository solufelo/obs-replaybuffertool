<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Solo Webcam Frame</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      width: 360px;
      height: 266px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      position: relative;
    }

    /* Precision Smoked Glass Bezel */
    .frame-container {
      position: absolute;
      inset: 1px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 14px 36px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      pointer-events: none;
      overflow: hidden;
    }

    /* Subtle edge vignette to blend camera edges */
    .inner-vignette {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    /* Luxury Studio Docked Badge */
    .studio-tag {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(9, 11, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 5px 12px;
      border-bottom-right-radius: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    /* Micro Broadcast Indicator Dot */
    .live-dot {
      width: 6px;
      height: 6px;
      background: #FF3B30;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 59, 48, 0.7);
      animation: livePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Studio Typography */
    .brand-name {
      font-size: 10.5px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-channel {
      font-size: 9px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding-left: 6px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div class="inner-vignette"></div>

    <div class="studio-tag">
      <img src="assets/captain_solo_logo.png" style="width: 14px; height: 14px; border-radius: 50%; object-fit: cover;" alt="Logo">
      <div class="live-dot"></div>
      <span class="brand-name">CAPTAIN SOLO</span>
      <span class="brand-channel">STUDIO</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captain Solo Kinetic Matrix Hybrid HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fixed 360x130 OBS Canvas - Strictly Bound, Zero Overflow */
    html, body {
      width: 360px;
      height: 130px;
      max-width: 360px;
      max-height: 130px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Esports HUD Container - Luxury Smoked Glass Deck */
    .hud-console {
      width: 354px;
      height: 122px;
      background: rgba(9, 12, 18, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 2.5px 4.5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Header: Beacon, Identity, Live Jitter/Combo Badge & Momentum Meter */
    .hud-header {
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .hud-tag {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hud-beacon {
      width: 4px;
      height: 4px;
      background: #00F0FF;
      border-radius: 50%;
      box-shadow: 0 0 6px #00F0FF;
      animation: beacon-pulse 1.8s infinite ease-in-out;
    }

    @keyframes beacon-pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 8px #00F0FF; }
    }

    /* Multi-Mode Dynamic Combo & Jitter Badge */
    .combo-badge {
      font-size: 7px;
      font-weight: 800;
      color: #0A0C10;
      background: #00F0FF;
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .combo-badge.standby {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.45);
      box-shadow: none;
    }

    .combo-badge.burst {
      background: #FFD700 !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.85) !important;
      transform: scale(1.04);
    }

    .combo-badge.hyper {
      background: #FF0055 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.95) !important;
      transform: scale(1.06);
    }

    .combo-badge.stim-green {
      background: #00FF66 !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.9) !important;
      transform: scale(1.05);
    }

    .combo-badge.superglide {
      background: #FFCC00 !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 16px rgba(255, 204, 0, 1) !important;
      transform: scale(1.08);
      animation: superglide-pulse 0.35s infinite alternate;
    }

    @keyframes superglide-pulse {
      0% { box-shadow: 0 0 10px rgba(255, 204, 0, 0.8); }
      100% { box-shadow: 0 0 20px rgba(255, 230, 0, 1); }
    }

    .combo-badge.gold {
      background: #FFD700 !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8) !important;
    }

    /* 4-Segment Luxury Momentum Meter */
    .momentum-meter {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .meter-label {
      font-size: 7px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    .meter-bars {
      display: flex;
      align-items: center;
      gap: 2.5px;
    }

    .meter-seg {
      width: 7px;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.08s ease;
    }

    .meter-seg.lit-1 {
      background: #00F0FF;
      border-color: #00F0FF;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
    }
    .meter-seg.lit-2 {
      background: #00FFE0;
      border-color: #00FFE0;
      box-shadow: 0 0 7px rgba(0, 255, 224, 0.85);
    }
    .meter-seg.lit-3 {
      background: #FFD700;
      border-color: #FFD700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.9);
    }
    .meter-seg.lit-4 {
      background: #FF0055;
      border-color: #FF0055;
      box-shadow: 0 0 10px rgba(255, 0, 85, 1);
    }

    /* Main HUD Body */
    .hud-body {
      height: 103px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    /* LEFT POD: Apex Combat & Movement Matrix */
    .keyboard-pod {
      width: 226px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .key-row {
      display: flex;
      align-items: center;
      gap: 3.5px;
      height: 31px;
    }

    /* Keycaps Base */
    .k-cap {
      height: 100%;
      background: rgba(14, 18, 26, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.04em;
      position: relative;
      transition: background 0.03s ease, border-color 0.03s ease, color 0.03s ease, transform 0.03s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .k-sub {
      font-size: 5.5px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    /* Key Sizes */
    .k-stim {
      width: 70px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .k-stim span {
      white-space: nowrap;
    }
    .k-stim .k-sub {
      font-size: 6.5px;
      font-weight: 900;
      color: #00FF66;
      margin-top: 0;
      white-space: nowrap;
    }

    .k-w { width: 32px; font-size: 11px; }
    .k-interact { width: 44px; }
    .k-wpn { width: 26px; font-size: 9px; }

    .k-shift { width: 52px; }
    .k-wasd { width: 33px; font-size: 11px; }
    .k-slide { width: 50px; }

    .k-holster { width: 35px; }
    .k-heal { width: 35px; }
    .k-jump { flex: 1; font-size: 10px; }

    /* Cap-Strafe Special Brackets */
    .cap-strafe-l {
      border-left: 2px solid rgba(0, 240, 255, 0.6);
    }
    .cap-strafe-r {
      border-right: 2px solid rgba(0, 240, 255, 0.6);
    }

    /* Active / Glowing States */
    .k-cap.active {
      background: #00F0FF !important;
      border-color: #00F0FF !important;
      color: #0A0C10 !important;
      transform: translateY(1px);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.8), inset 0 0 4px rgba(255, 255, 255, 0.8) !important;
    }

    .k-cap.active .k-sub {
      color: rgba(10, 12, 16, 0.85) !important;
      font-weight: 900;
    }

    /* Stim Key Active: Octane Neon Lime Glow */
    .k-cap.k-stim.active {
      background: #00FF66 !important;
      border-color: #00FF66 !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.9), inset 0 0 4px rgba(255, 255, 255, 0.8) !important;
    }
    .k-cap.k-stim.active .k-sub {
      color: #0A0C10 !important;
    }

    /* Superglide Lock Active: Pulsing Golden Energy */
    .k-cap.superglide {
      background: #FFD700 !important;
      border-color: #FFFFFF !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 18px rgba(255, 215, 0, 1), inset 0 0 8px rgba(255, 255, 255, 0.9) !important;
      transform: translateY(1px) scale(1.02);
    }
    .k-cap.superglide .k-sub {
      color: #0A0C10 !important;
    }

    /* Counter-Strafe Chain Glow */
    .k-cap.strafe-hot {
      background: #00FFCC !important;
      border-color: #00FFCC !important;
      color: #0A0C10 !important;
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.9) !important;
    }

    /* Release Trail */
    .k-cap.trail {
      border-color: rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.12);
    }

    /* Divider */
    .hud-divider {
      width: 1px;
      height: 98px;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, 0.25) 30%, rgba(0, 240, 255, 0.25) 70%, transparent 100%);
    }

    /* RIGHT POD: Strafe Cadence & Esports Mouse Matrix */
    .mouse-pod {
      width: 116px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }

    /* Live AD Jitter Oscillation Engine */
    .jitter-engine-box {
      width: 100%;
      height: 29px;
      background: rgba(14, 18, 26, 0.78);
      border: 1px solid rgba(0, 240, 255, 0.22);
      border-radius: 3px;
      padding: 2px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .jitter-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 6.5px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .jitter-hz-val {
      color: #00F0FF;
      font-size: 7.5px;
      font-weight: 900;
    }

    .oscillation-track {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 2px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .center-notch {
      width: 1px;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
    }

    .oscillation-needle {
      position: absolute;
      width: 16px;
      height: 6px;
      border-radius: 1px;
      background: #00F0FF;
      box-shadow: 0 0 8px #00F0FF;
      left: calc(50% - 8px);
      transition: transform 0.05s ease-out, background 0.1s ease;
    }

    .osc-lbl-l, .osc-lbl-r {
      font-size: 6px;
      font-weight: 800;
      position: absolute;
      top: 1px;
      color: rgba(255, 255, 255, 0.35);
      transition: color 0.05s ease;
    }
    .osc-lbl-l { left: 3px; }
    .osc-lbl-r { right: 3px; }

    .osc-lbl-l.hot, .osc-lbl-r.hot {
      color: #00F0FF;
      text-shadow: 0 0 5px #00F0FF;
    }

    /* Mouse Section: Wheel Pillar + Contoured Chassis */
    .mouse-cluster {
      width: 100%;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    /* Vertical Scroll Wheel Pillar (Tap-Strafe & Bhop Jump) */
    .wheel-pillar {
      width: 34px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }

    .wheel-btn {
      flex: 1;
      background: rgba(14, 18, 26, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: all 0.04s ease;
      position: relative;
    }

    .wheel-btn .w-glyph {
      font-size: 8px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.5);
    }

    .wheel-btn .w-lbl {
      font-size: 6.5px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.75);
    }

    .wheel-btn.up.active {
      background: #00F0FF !important;
      border-color: #00F0FF !important;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
      transform: translateY(-1px);
    }
    .wheel-btn.up.active .w-glyph,
    .wheel-btn.up.active .w-lbl {
      color: #0A0C10 !important;
      font-weight: 900;
    }

    .wheel-btn.down.active {
      background: #FFD700 !important;
      border-color: #FFD700 !important;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
      transform: translateY(1px);
    }
    .wheel-btn.down.active .w-glyph,
    .wheel-btn.down.active .w-lbl {
      color: #0A0C10 !important;
      font-weight: 900;
    }

    /* Contoured Esports Mouse Chassis with Side Buttons & CPS */
    .mouse-chassis {
      flex: 1;
      height: 100%;
      background: rgba(12, 15, 22, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px 12px 6px 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.45);
      overflow: visible;
    }

    .mouse-clickers {
      height: 38px;
      width: 100%;
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-top-left-radius: 11px;
      border-top-right-radius: 11px;
      overflow: hidden;
      position: relative;
    }

    .m-click-half {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 3px;
      font-size: 7.5px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.6);
      transition: background 0.04s ease, box-shadow 0.04s ease;
      cursor: default;
      position: relative;
    }

    .m-click-half.left {
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-top-left-radius: 11px;
    }

    .m-click-half.right {
      border-top-right-radius: 11px;
    }

    .m-click-half.left.active {
      background: linear-gradient(180deg, #00F0FF 0%, rgba(0, 190, 230, 0.8) 100%) !important;
      color: #0A0C10 !important;
      border-top-left-radius: 11px !important;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.9), 0 0 10px rgba(0, 240, 255, 0.7) !important;
    }

    .m-click-half.right.active {
      background: linear-gradient(180deg, #00FFE0 0%, rgba(0, 210, 200, 0.8) 100%) !important;
      color: #0A0C10 !important;
      border-top-right-radius: 11px !important;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.9), 0 0 10px rgba(0, 255, 224, 0.7) !important;
    }

    .m-wheel-well {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 18px;
      background: #06080B;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1px 0;
      z-index: 5;
    }

    .wheel-nub {
      width: 6px;
      height: 6px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.06s ease;
    }

    .wheel-nub.active-up {
      background: #00F0FF;
      box-shadow: 0 0 6px #00F0FF;
      transform: translateY(-2px);
    }

    .wheel-nub.active-down {
      background: #FFD700;
      box-shadow: 0 0 6px #FFD700;
      transform: translateY(2px);
    }

    /* Side Button Thumb Pips (MB5 Heal - top, MB4 Holster - bottom) */
    .m-side-tab {
      position: absolute;
      left: -4px;
      width: 3px;
      height: 12px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 2px 0 0 2px;
      transition: all 0.03s ease;
      z-index: 4;
    }
    .m-side-tab.mb5 { top: 18px; }
    .m-side-tab.mb4 { top: 34px; }

    .m-side-tab.active {
      background: #00F0FF !important;
      box-shadow: 0 0 8px #00F0FF;
      width: 4px;
      left: -5px;
    }

    /* Mouse Palm: Real-Time CPS + Polling Tag */
    .mouse-palm {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }

    .palm-cps {
      font-size: 6px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.06em;
    }

    .palm-cps span {
      color: #00F0FF;
      font-weight: 900;
    }

    .palm-tag {
      font-size: 6px;
      font-weight: 800;
      color: rgba(0, 240, 255, 0.7);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="hud-console">
    <!-- Header: Beacon, Identity, Live Jitter/Combo Badge & Momentum Meter -->
    <div class="hud-header">
      <div class="hud-tag">
        <span class="hud-beacon"></span>
        <span>KINETIC MATRIX HUD</span>
      </div>
      <div id="comboBadge" class="combo-badge standby">READY</div>
      <div class="momentum-meter">
        <span class="meter-label">MOMENTUM</span>
        <div class="meter-bars">
          <div class="meter-seg" id="seg1"></div>
          <div class="meter-seg" id="seg2"></div>
          <div class="meter-seg" id="seg3"></div>
          <div class="meter-seg" id="seg4"></div>
        </div>
      </div>
    </div>

    <!-- Main HUD Cluster -->
    <div class="hud-body">
      <!-- LEFT POD: Apex Tactical & Movement Grid -->
      <div class="keyboard-pod">
        <!-- Row 1: Tactical Stim [L-Alt / P], Forward [W], Interact [E], Weapon [1/2] -->
        <div class="key-row">
          <div id="key-stim" class="k-cap k-stim" title="Octane Stim (Left Alt) - 'Faster, Faster, Faster!'">
            <span>L-ALT</span>
            <span class="k-sub">STIM ⚡</span>
          </div>
          <div id="key-w" class="k-cap k-w">W</div>
          <div id="key-interact" class="k-cap k-interact" title="E: Interact / Use">
            <span>E</span>
            <span class="k-sub">USE</span>
          </div>
          <div id="key-1" class="k-cap k-wpn" title="1: Primary Weapon">
            <span>1</span>
            <span class="k-sub">PRI</span>
          </div>
          <div id="key-2" class="k-cap k-wpn" title="2: Secondary Weapon">
            <span>2</span>
            <span class="k-sub">SEC</span>
          </div>
        </div>

        <!-- Row 2: Zoom/Walk [Shift], Strafe Left [A], Backward [S], Strafe Right [D], Slide [C] -->
        <div class="key-row">
          <div id="key-shift" class="k-cap k-shift" title="Shift: Scope Zoom & Walk">
            <span>SHIFT</span>
            <span class="k-sub">ZOOM/WALK</span>
          </div>
          <div id="key-a" class="k-cap k-wasd cap-strafe-l" title="A: Strafe Left">A</div>
          <div id="key-s" class="k-cap k-wasd" title="S: Backward">S</div>
          <div id="key-d" class="k-cap k-wasd cap-strafe-r" title="D: Strafe Right">D</div>
          <div id="key-c" class="k-cap k-slide" title="C: Slide / Crouch (Superglide Macro)">
            <span>C</span>
            <span class="k-sub">SLIDE</span>
          </div>
        </div>

        <!-- Row 3: Stow [3 / MB4], Heal [4 / MB5], Jump [Space] -->
        <div class="key-row">
          <div id="btn-holster" class="k-cap k-holster" title="3 / MB4: Holster / Stow">
            <span>3</span>
            <span class="k-sub">STOW</span>
          </div>
          <div id="btn-heal" class="k-cap k-heal" title="4 / MB5: Heal Kit">
            <span>4</span>
            <span class="k-sub">HEAL</span>
          </div>
          <div id="key-space" class="k-cap k-jump" title="Space: Jump / Mantle (Superglide)">
            <span>SPACE</span>
            <span class="k-sub">JUMP</span>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="hud-divider"></div>

      <!-- RIGHT POD: Strafe Cadence Visualizer & Esports Mouse Matrix -->
      <div class="mouse-pod">
        <!-- Live AD Jitter Oscillation Gauge -->
        <div class="jitter-engine-box">
          <div class="jitter-top-row">
            <span>STRAFE CADENCE</span>
            <span id="hzReadout" class="jitter-hz-val">0.0 HZ</span>
          </div>
          <div class="oscillation-track">
            <span id="oscLeftLbl" class="osc-lbl-l">◀ A</span>
            <div class="center-notch"></div>
            <div id="oscNeedle" class="oscillation-needle"></div>
            <span id="oscRightLbl" class="osc-lbl-r">D ▶</span>
          </div>
        </div>

        <!-- Mouse Cluster: Vertical Wheel Pillar + Contoured Chassis -->
        <div class="mouse-cluster">
          <!-- Scroll Wheel Pillar (Tap-Strafe & Bhop Jump) -->
          <div class="wheel-pillar">
            <div id="wheel-up" class="wheel-btn up" title="Scroll Up: Tap-Strafe">
              <span class="w-glyph">▲</span>
              <span class="w-lbl">TAP</span>
            </div>
            <div id="wheel-down" class="wheel-btn down" title="Scroll Down: Jump / Bhop">
              <span class="w-glyph">▼</span>
              <span class="w-lbl">JUMP</span>
            </div>
          </div>

          <!-- Esports Mouse Chassis with Side Buttons, Center Wheel Nub, and CPS Base -->
          <div class="mouse-chassis" id="mouseChassis">
            <div id="side-mb5" class="m-side-tab mb5" title="MB5: Heal Kit"></div>
            <div id="side-mb4" class="m-side-tab mb4" title="MB4: Holster Weapon"></div>

            <div class="mouse-clickers">
              <div id="mouse-lmb" class="m-click-half left" title="Left Click: Primary Fire">LMB</div>
              <div class="m-wheel-well">
                <div id="wheelPip" class="wheel-nub"></div>
              </div>
              <div id="mouse-rmb" class="m-click-half right" title="Right Click: ADS / Aim">RMB</div>
            </div>

            <div class="mouse-palm">
              <div class="palm-cps"><span id="cpsVal">0</span> CPS</div>
              <span class="palm-tag">8K RAW</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Element Registry
    const elements = {
      'W': document.getElementById('key-w'),
      'A': document.getElementById('key-a'),
      'S': document.getElementById('key-s'),
      'D': document.getElementById('key-d'),
      'STIM': document.getElementById('key-stim'),
      'INTERACT': document.getElementById('key-interact'),
      'SPRINT': document.getElementById('key-shift'),
      'CROUCH': document.getElementById('key-c'),
      'JUMP': document.getElementById('key-space'),
      'HOLSTER': document.getElementById('btn-holster'),
      'HEAL': document.getElementById('btn-heal'),
      '1': document.getElementById('key-1'),
      '2': document.getElementById('key-2'),
      'MB4': document.getElementById('side-mb4'),
      'MB5': document.getElementById('side-mb5'),
      'LMB': document.getElementById('mouse-lmb'),
      'RMB': document.getElementById('mouse-rmb'),
      'WHEEL_UP': document.getElementById('wheel-up'),
      'WHEEL_DOWN': document.getElementById('wheel-down'),
      'WHEEL_PIP': document.getElementById('wheelPip')
    };

    // Telemetry & Widget Elements
    const comboBadge = document.getElementById('comboBadge');
    const hzReadout = document.getElementById('hzReadout');
    const oscNeedle = document.getElementById('oscNeedle');
    const oscLeftLbl = document.getElementById('oscLeftLbl');
    const oscRightLbl = document.getElementById('oscRightLbl');
    const cpsVal = document.getElementById('cpsVal');
    const mouseChassis = document.getElementById('mouseChassis');

    const segs = [
      document.getElementById('seg1'),
      document.getElementById('seg2'),
      document.getElementById('seg3'),
      document.getElementById('seg4')
    ];

    // Key Mapping Aliases
    const KEY_ALIASES = {
      'C': 'CROUCH',
      'CTRL': 'CROUCH',
      'SPACE': 'JUMP',
      'SHIFT': 'SPRINT',
      'E': 'INTERACT',
      'P': 'STIM',        // Virtual Key P from Windows (physically Left Alt on Ace 68)
      'LALT': 'STIM',     // Direct Left Alt fallback
      'ALT': 'STIM',
      '3': 'HOLSTER',
      '4': 'HEAL',
      '1': '1',
      '2': '2'
    };

    // State & Timing Trackers
    const inputHistory = [];
    const lmbTimestamps = [];
    const trailTimers = {};
    let wheelUpTimer = null;
    let wheelDownTimer = null;
    let badgeTimer = null;

    // Superglide Macro Synchronization (85ms Window)
    let lastJumpTime = 0;
    let lastCrouchTime = 0;
    let isSupergliding = false;

    // AD Counter-Strafe & Jitter Cadence Engine
    let lastA = 0;
    let lastD = 0;
    let lastStrafeKey = null;
    let currentStrafeHz = 0;

    function recordInputEvent() {
      const now = performance.now();
      inputHistory.push(now);

      while (inputHistory.length > 0 && now - inputHistory[0] > 1100) {
        inputHistory.shift();
      }

      const count = inputHistory.length;
      segs[0].className = count >= 2 ? 'meter-seg lit-1' : 'meter-seg';
      segs[1].className = count >= 5 ? 'meter-seg lit-2' : 'meter-seg';
      segs[2].className = count >= 8 ? 'meter-seg lit-3' : 'meter-seg';
      segs[3].className = count >= 12 ? 'meter-seg lit-4' : 'meter-seg';
    }

    // 120ms Periodic Decay & Polling
    setInterval(() => {
      const now = performance.now();

      // Momentum decay
      while (inputHistory.length > 0 && now - inputHistory[0] > 1100) {
        inputHistory.shift();
      }
      const count = inputHistory.length;
      segs[0].className = count >= 2 ? 'meter-seg lit-1' : 'meter-seg';
      segs[1].className = count >= 5 ? 'meter-seg lit-2' : 'meter-seg';
      segs[2].className = count >= 8 ? 'meter-seg lit-3' : 'meter-seg';
      segs[3].className = count >= 12 ? 'meter-seg lit-4' : 'meter-seg';

      // CPS decay
      while (lmbTimestamps.length > 0 && now - lmbTimestamps[0] > 1000) {
        lmbTimestamps.shift();
      }
      cpsVal.textContent = lmbTimestamps.length;

      // Strafe Cadence decay if idle
      if (now - Math.max(lastA, lastD) > 420) {
        currentStrafeHz = Math.max(0, currentStrafeHz * 0.7);
        if (currentStrafeHz < 0.2) {
          currentStrafeHz = 0;
          oscNeedle.style.transform = 'translateX(0px)';
          oscNeedle.style.background = '#00F0FF';
          oscNeedle.style.boxShadow = '0 0 8px #00F0FF';
          oscLeftLbl.classList.remove('hot');
          oscRightLbl.classList.remove('hot');
          hzReadout.textContent = '0.0 HZ';

          if (!badgeTimer && comboBadge.textContent.includes('HZ')) {
            comboBadge.className = 'combo-badge standby';
            comboBadge.textContent = 'READY';
          }
        } else {
          hzReadout.textContent = currentStrafeHz.toFixed(1) + ' HZ';
        }
      }
    }, 120);

    // Dynamic Combo Badge Trigger
    function triggerComboBadge(text, styleClass, duration = 600) {
      clearTimeout(badgeTimer);
      comboBadge.className = `combo-badge ${styleClass}`;
      comboBadge.textContent = text;

      badgeTimer = setTimeout(() => {
        badgeTimer = null;
        if (currentStrafeHz >= 0.5) {
          updateJitterDisplay(currentStrafeHz);
        } else {
          comboBadge.className = 'combo-badge standby';
          comboBadge.textContent = 'READY';
        }
      }, duration);
    }

    // High-Precision Superglide Lock
    function triggerSuperglideLock() {
      isSupergliding = true;
      triggerComboBadge('⚡ SUPERGLIDE ⚡', 'superglide', 750);

      const jEl = elements['JUMP'];
      const cEl = elements['CROUCH'];
      if (jEl) jEl.classList.add('superglide');
      if (cEl) cEl.classList.add('superglide');

      setTimeout(() => {
        isSupergliding = false;
        if (jEl && !jEl.classList.contains('active')) jEl.classList.remove('superglide');
        if (cEl && !cEl.classList.contains('active')) cEl.classList.remove('superglide');
      }, 500);
    }

    // AD Counter-Strafe & Jitter Cadence Calculation
    function handleStrafeChange(key, active) {
      const now = performance.now();
      if (!active) return;

      if (key === 'A') {
        lastA = now;
        oscLeftLbl.classList.add('hot');
        oscRightLbl.classList.remove('hot');
        oscNeedle.style.transform = 'translateX(-34px)';

        if (lastStrafeKey === 'D') {
          const delta = now - lastD;
          if (delta > 30 && delta < 480) {
            currentStrafeHz = 1000 / (delta * 2);
            updateJitterDisplay(currentStrafeHz);
          }
        }
        lastStrafeKey = 'A';
      } else if (key === 'D') {
        lastD = now;
        oscRightLbl.classList.add('hot');
        oscLeftLbl.classList.remove('hot');
        oscNeedle.style.transform = 'translateX(34px)';

        if (lastStrafeKey === 'A') {
          const delta = now - lastA;
          if (delta > 30 && delta < 480) {
            currentStrafeHz = 1000 / (delta * 2);
            updateJitterDisplay(currentStrafeHz);
          }
        }
        lastStrafeKey = 'D';
      }
    }

    function updateJitterDisplay(hz) {
      const formatted = hz.toFixed(1);
      hzReadout.textContent = formatted + ' HZ';

      if (badgeTimer) return; // Do not override high-priority Superglide or Stim voice lines

      if (hz >= 10.0) {
        comboBadge.className = 'combo-badge hyper';
        comboBadge.textContent = '⚡ HYPER JITTER ' + formatted + ' HZ';
        oscNeedle.style.background = '#FF0055';
        oscNeedle.style.boxShadow = '0 0 12px #FF0055';
        if (elements['A']) elements['A'].classList.add('strafe-hot');
        if (elements['D']) elements['D'].classList.add('strafe-hot');
      } else if (hz >= 6.0) {
        comboBadge.className = 'combo-badge burst';
        comboBadge.textContent = '✦ AD BURST ' + formatted + ' HZ';
        oscNeedle.style.background = '#FFD700';
        oscNeedle.style.boxShadow = '0 0 10px #FFD700';
        if (elements['A']) elements['A'].classList.add('strafe-hot');
        if (elements['D']) elements['D'].classList.add('strafe-hot');
      } else {
        comboBadge.className = 'combo-badge';
        comboBadge.textContent = 'AD JITTER ' + formatted + ' HZ';
        oscNeedle.style.background = '#00F0FF';
        oscNeedle.style.boxShadow = '0 0 8px #00F0FF';
      }
    }

    // Set Key State
    function setKey(rawName, active) {
      const name = KEY_ALIASES[rawName] || rawName;
      recordInputEvent();

      // Side Button Sync: MB4 activates HOLSTER (3), MB5 activates HEAL (4)
      if (name === 'HOLSTER' || rawName === 'MB4') {
        if (elements['MB4']) {
          if (active) elements['MB4'].classList.add('active');
          else elements['MB4'].classList.remove('active');
        }
      } else if (name === 'HEAL' || rawName === 'MB5') {
        if (elements['MB5']) {
          if (active) elements['MB5'].classList.add('active');
          else elements['MB5'].classList.remove('active');
        }
      }

      // Strafe Cadence
      if (name === 'A' || name === 'D') {
        handleStrafeChange(name, active);
      }

      // CPS on LMB click
      if (name === 'LMB' && active) {
        lmbTimestamps.push(performance.now());
        cpsVal.textContent = lmbTimestamps.length;
      }

      const el = elements[name];
      if (!el) return;

      if (active) {
        clearTimeout(trailTimers[name]);
        el.classList.remove('trail');
        el.classList.add('active');

        const now = performance.now();

        // High-Precision Superglide Macro Sync (85ms window)
        if (name === 'JUMP') {
          lastJumpTime = now;
          const crouchActive = elements['CROUCH'] && elements['CROUCH'].classList.contains('active');
          if (crouchActive || Math.abs(lastJumpTime - lastCrouchTime) < 85) {
            triggerSuperglideLock();
          }
        } else if (name === 'CROUCH') {
          lastCrouchTime = now;
          const jumpActive = elements['JUMP'] && elements['JUMP'].classList.contains('active');
          if (jumpActive || Math.abs(lastJumpTime - lastCrouchTime) < 85) {
            triggerSuperglideLock();
          }
        }

        // Octane Stim Tactical Trigger ("Faster, Faster, Faster!")
        if (name === 'STIM') {
          const stimLines = ['⚡ FASTER, FASTER, FASTER!', '💉 MUST GO FASTER!', '⚡ STIM SPEED'];
          const line = stimLines[Math.floor(Math.random() * stimLines.length)];
          triggerComboBadge(line, 'stim-green', 500);
        }

        if (name === 'LMB' || name === 'RMB') {
          mouseChassis.style.borderColor = '#00F0FF';
          mouseChassis.style.boxShadow = '0 0 10px rgba(0, 240, 255, 0.5)';
        }
      } else {
        el.classList.remove('active', 'strafe-hot');
        if (!isSupergliding) {
          el.classList.remove('superglide');
        }
        el.classList.add('trail');

        trailTimers[name] = setTimeout(() => {
          el.classList.remove('trail');
          if (!isSupergliding) {
            el.classList.remove('superglide');
          }
        }, 180);

        if (name === 'LMB' || name === 'RMB') {
          if (!elements['LMB'].classList.contains('active') && !elements['RMB'].classList.contains('active')) {
            mouseChassis.style.borderColor = 'rgba(0, 240, 255, 0.25)';
            mouseChassis.style.boxShadow = 'none';
          }
        }
      }
    }

    // Scroll Wheel Handling
    function triggerWheel(direction) {
      recordInputEvent();
      const pip = elements['WHEEL_PIP'];

      if (direction === 'up') {
        // UP = TAP-STRAFE
        const ind = elements['WHEEL_UP'];
        ind.classList.add('active');
        pip.className = 'wheel-nub active-up';
        triggerComboBadge('▲ TAP-STRAFE', 'combo-badge', 320);

        clearTimeout(wheelUpTimer);
        wheelUpTimer = setTimeout(() => {
          ind.classList.remove('active');
          pip.className = 'wheel-nub';
        }, 90);

      } else if (direction === 'down') {
        // DOWN = JUMP / BHOP
        const ind = elements['WHEEL_DOWN'];
        ind.classList.add('active');
        pip.className = 'wheel-nub active-down';
        triggerComboBadge('▼ JUMP', 'gold', 320);

        clearTimeout(wheelDownTimer);
        wheelDownTimer = setTimeout(() => {
          ind.classList.remove('active');
          pip.className = 'wheel-nub';
        }, 90);
      }
    }

    // Connect to Win32 Input Daemon WebSocket
    function connectWS() {
      const ws = new WebSocket('ws://127.0.0.1:8998/ws');

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'key') {
            setKey(data.name, data.down);
          } else if (data.type === 'wheel') {
            triggerWheel(data.dir);
          }
        } catch (e) {
          console.error('WS parse error:', e);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWS, 1000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectWS();

    // Browser Keyboard Fallback
    window.addEventListener('keydown', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', true);
      if (k === 'A') setKey('A', true);
      if (k === 'S') setKey('S', true);
      if (k === 'D') setKey('D', true);
      if (k === 'P' || e.code === 'AltLeft' || e.key === 'Alt') setKey('STIM', true);
      if (k === 'E') setKey('INTERACT', true);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', true);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', true);
      if (k === 'SHIFT') setKey('SPRINT', true);
      if (k === '1') setKey('1', true);
      if (k === '2') setKey('2', true);
      if (k === '3') setKey('HOLSTER', true);
      if (k === '4') setKey('HEAL', true);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'W') setKey('W', false);
      if (k === 'A') setKey('A', false);
      if (k === 'S') setKey('S', false);
      if (k === 'D') setKey('D', false);
      if (k === 'P' || e.code === 'AltLeft' || e.key === 'Alt') setKey('STIM', false);
      if (k === 'E') setKey('INTERACT', false);
      if (k === 'C' || e.code === 'ControlLeft') setKey('CROUCH', false);
      if (k === ' ' || e.code === 'Space') setKey('JUMP', false);
      if (k === 'SHIFT') setKey('SPRINT', false);
      if (k === '1') setKey('1', false);
      if (k === '2') setKey('2', false);
      if (k === '3') setKey('HOLSTER', false);
      if (k === '4') setKey('HEAL', false);
    });

    // Browser Wheel Fallback
    window.addEventListener('wheel', (e) => {
      if (e.deltaY < 0) triggerWheel('up');
      else if (e.deltaY > 0) triggerWheel('down');
    });

    // Browser Mouse Fallback
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) setKey('LMB', true);
      if (e.button === 2) setKey('RMB', true);
      if (e.button === 3) setKey('MB4', true);
      if (e.button === 4) setKey('MB5', true);
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) setKey('LMB', false);
      if (e.button === 2) setKey('RMB', false);
      if (e.button === 3) setKey('MB4', false);
      if (e.button === 4) setKey('MB5', false);
    });

    window.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>

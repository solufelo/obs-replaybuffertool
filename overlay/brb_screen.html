<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Solo // Be Right Back</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(ellipse at center, #10141D 0%, #06080B 100%);
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .center-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 13, 18, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      padding: 56px 84px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      min-width: 680px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #FF9500;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 149, 0, 0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .status-text {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 34px;
    }

    /* Ranked Status Pill */
    .rank-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 24px;
      margin-bottom: 34px;
    }

    .rank-badge-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .rank-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .rank-tier {
      font-size: 12px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .rank-rp {
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.1em;
    }

    /* Social Bar */
    .social-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      justify-content: center;
    }

    .social-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.08em;
    }

    .social-icon {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
